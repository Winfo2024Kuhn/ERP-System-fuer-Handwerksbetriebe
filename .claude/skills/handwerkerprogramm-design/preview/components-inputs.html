<!doctype html>
<!-- @dsCard group="Components" name="Components — Inputs" subtitle="Form fields with rose focus ring" viewport="720x340" -->
<html lang="de"><head><meta charset="utf-8" /><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{font-family:var(--font-sans);color:var(--fg);padding:16px;box-sizing:border-box;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .field label{display:block;font-size:14px;font-weight:600;color:var(--slate-700);margin-bottom:6px}
  .input{width:100%;border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-size:14px;color:var(--slate-900);background:#fff;box-sizing:border-box;font-family:var(--font-sans)}
  .input:focus{outline:none;box-shadow:0 0 0 2px var(--brand-ring)}
  .input.focus{box-shadow:0 0 0 2px var(--brand-ring)}
  .input.err{border-color:var(--danger)}
  .hint{font-size:12px;color:var(--fg-muted);margin-top:4px}
  .hint.err{color:var(--danger)}
  .select{position:relative}
  .select::after{content:"";position:absolute;right:12px;top:50%;width:8px;height:8px;border-right:2px solid var(--slate-400);border-bottom:2px solid var(--slate-400);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .name{font-weight:700;font-size:14px}.sub{font-size:12px;color:var(--fg-muted)}
  [data-lucide]{width:14px;height:14px;stroke-width:2;color:var(--slate-400)}
  .ico-wrap{position:relative}
  .ico-wrap [data-lucide]{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
  .ico-wrap .input{padding-left:32px}
</style></head><body>
<div class="header"><div><div class="name">Form inputs</div><div class="sub">Border slate-200 · radius 4 · focus ring rose-500</div></div></div>
<div class="grid">
  <div class="field">
    <label>Freitext</label>
    <div class="ico-wrap"><i data-lucide="search"></i><input class="input" placeholder="Bauvorhaben, Kunde…" /></div>
    <div class="hint">Volltextsuche über alle Felder.</div>
  </div>
  <div class="field">
    <label>Kunde</label>
    <input class="input focus" value="Müller GmbH" />
    <div class="hint">Fokus · ring rose-500</div>
  </div>
  <div class="field">
    <label>Status</label>
    <div class="select"><select class="input" style="appearance:none;padding-right:28px"><option>Alle</option><option>Offen</option><option>Gebucht</option></select></div>
    <div class="hint">Nativer Select · custom chevron.</div>
  </div>
  <div class="field">
    <label>Datum</label>
    <input class="input" value="10.03.2026" />
    <div class="hint">DD.MM.YYYY · de-format</div>
  </div>
  <div class="field">
    <label>Betrag</label>
    <input class="input" value="1.248,90 €" style="font-variant-numeric:tabular-nums" />
    <div class="hint">tabular-nums · deutsche Zahl</div>
  </div>
  <div class="field">
    <label>E-Mail</label>
    <input class="input err" value="kunde@" />
    <div class="hint err">Ungültige E-Mail-Adresse.</div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body></html>
