<!doctype html>
<!-- @dsCard group="Brand" name="Brand — App logo" subtitle="Hammer + gear on rose — primary app icon" viewport="640x260" -->
<html lang="de"><head><meta charset="utf-8" /><title>Brand · Logo</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{font-family:var(--font-sans);color:var(--fg);padding:16px;box-sizing:border-box}
  .grid{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center}
  .logo{width:180px;height:180px;border-radius:32px;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--rose-100)}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .name{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .sub{font-size:13px;color:var(--fg-muted);margin-top:4px;line-height:1.5}
  .mono{font-family:var(--font-mono);font-size:11px;color:var(--slate-700);background:var(--slate-100);padding:3px 8px;border-radius:4px;display:inline-block;margin-top:10px}
  .row{display:flex;gap:10px;margin-top:12px;align-items:center}
  .sizes{display:flex;gap:10px;align-items:flex-end;margin-top:14px}
  .s{border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .s-lg{width:64px;height:64px}.s-md{width:40px;height:40px;border-radius:8px}.s-sm{width:24px;height:24px;border-radius:6px}
  .s img{width:100%;height:100%;object-fit:cover;display:block}
  .cap{font-size:10px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;text-align:center}
</style></head><body>
<div class="grid">
  <div class="logo"><img src="../assets/app_logo.png" alt="Handwerkerprogramm app icon" /></div>
  <div>
    <div class="name">Handwerkerprogramm</div>
    <div class="sub">Das Open-Source-ERP, das für Handwerksbetriebe gebaut wurde – nicht an sie angepasst.</div>
    <span class="mono">assets/app_logo.png</span>
    <div class="sizes">
      <div><div class="s s-lg"><img src="../assets/app_logo.png" /></div><div class="cap">64</div></div>
      <div><div class="s s-md"><img src="../assets/app_logo.png" /></div><div class="cap">40</div></div>
      <div><div class="s s-sm"><img src="../assets/app_logo.png" /></div><div class="cap">24</div></div>
    </div>
  </div>
</div>
</body></html>
