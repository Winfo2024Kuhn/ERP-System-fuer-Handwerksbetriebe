<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Semantic" subtitle="Success / warn / danger / info / AI" viewport="720x220" -->
<html lang="de"><head><meta charset="utf-8" /><title>Colors — Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{font-family:var(--font-sans);color:var(--fg);padding:16px;box-sizing:border-box}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .cell{border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .chip{padding:14px;color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
  .chip .dot{width:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.85)}
  .soft{padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
  .meta{font-size:11px;color:var(--fg-muted);padding:8px 14px 12px;font-family:var(--font-mono)}
  .header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .name{font-weight:700;font-size:14px}
  .sub{font-size:12px;color:var(--fg-muted)}
</style></head><body>
<div class="header"><div><div class="name">Semantic colors</div><div class="sub">Pair solid + soft bg for badges & states.</div></div></div>
<div class="grid">
  <div class="cell"><div class="chip" style="background:#16a34a">Success</div><div class="soft" style="background:#dcfce7;color:#166534">Online · Gebucht</div><div class="meta">#16a34a / #dcfce7</div></div>
  <div class="cell"><div class="chip" style="background:#f59e0b">Warn</div><div class="soft" style="background:#fef3c7;color:#854d0e">Offen · Pending</div><div class="meta">#f59e0b / #fef3c7</div></div>
  <div class="cell"><div class="chip" style="background:#dc2626">Danger</div><div class="soft" style="background:#fee2e2;color:#991b1b">Überfällig · Error</div><div class="meta">#dc2626 / #fee2e2</div></div>
  <div class="cell"><div class="chip" style="background:#6366f1">Info</div><div class="soft" style="background:#e0e7ff;color:#4338ca">{{PLATZHALTER}}</div><div class="meta">#6366f1 / #e0e7ff</div></div>
  <div class="cell"><div class="chip" style="background:#a855f7">KI · AI</div><div class="soft" style="background:#f3e8ff;color:#6b21a8">Gemini · KI-Hilfe</div><div class="meta">#a855f7 / #f3e8ff</div></div>
</div>
</body></html>
