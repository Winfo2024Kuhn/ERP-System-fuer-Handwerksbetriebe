<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Rose scale" subtitle="Tailwind rose · 600 is brand" viewport="720x200" -->
<html lang="de"><head><meta charset="utf-8" /><title>Colors — Brand</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{font-family:var(--font-sans);color:var(--fg);padding:16px;box-sizing:border-box}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .sw{aspect-ratio:1/1;border-radius:10px;display:flex;align-items:flex-end;padding:8px;font-size:10px;font-weight:600;color:#fff;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .sw.dark{color:#fff}
  .sw.light{color:var(--slate-900)}
  .meta{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .name{font-weight:700;font-size:14px}
  .sub{font-size:12px;color:var(--fg-muted)}
  .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--brand);color:#fff;letter-spacing:.05em;text-transform:uppercase}
  .legend{display:flex;gap:12px;margin-top:12px;font-size:11px;color:var(--fg-muted)}
  .legend b{color:var(--fg);font-weight:600}
</style></head><body>
  <div class="meta">
    <div>
      <div class="name">Rose · Brand scale</div>
      <div class="sub">Tailwind rose. 600 = primary.</div>
    </div>
    <span class="tag">Primary · rose-600 #e11d48</span>
  </div>
  <div class="row">
    <div class="sw light" style="background:#fff1f2">50</div>
    <div class="sw light" style="background:#ffe4e6">100</div>
    <div class="sw light" style="background:#fecdd3">200</div>
    <div class="sw light" style="background:#fda4af">300</div>
    <div class="sw dark" style="background:#fb7185">400</div>
    <div class="sw dark" style="background:#f43f5e">500</div>
    <div class="sw dark" style="background:#e11d48;outline:2px solid var(--slate-900);outline-offset:2px">600</div>
    <div class="sw dark" style="background:#be123c">700</div>
    <div class="sw dark" style="background:#9f1239">800</div>
    <div class="sw dark" style="background:#881337">900</div>
  </div>
  <div class="legend"><span><b>Primary:</b> 600 on buttons, active nav</span><span><b>Hover:</b> 700</span><span><b>Soft bg:</b> 50 / 100</span><span><b>Borders:</b> 200</span></div>
</body></html>
