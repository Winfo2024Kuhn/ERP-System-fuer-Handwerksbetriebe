<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover ist Pflicht, sonst liefert env(safe-area-inset-*) immer 0
       und der Inhalt landet unter der durchscheinenden iOS-Statusleiste. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#dc2626" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- "default" statt "black-translucent" (iOS 26/27, "Liquid Glass"):
       black-translucent legt den Inhalt UNTER die Statusleiste und erzeugt oben einen
       Safe-Area-Inset. Genau diesen Inset fuellt iOS seit 26 mit dem Liquid-Glass-
       Material und legt einen Weichzeichner ("scroll edge effect") ueber die obersten
       ~35pt - oberhalb der WebView, also mit CSS nicht abschaltbar. iOS 27 hat den
       Effekt deutlich verstaerkt; die Kopfzeile ("Hi, Max!") wirkte dadurch dauerhaft
       unscharf. Nur im installierten Standalone-Modus und nur im Hochformat.
       Mit "default" bleibt die Statusleiste opak und die WebView sitzt darunter:
       kein Inset -> nichts zu fuellen -> kein Weichzeichner.

       Folgen: safe-area-inset-top ist im Standalone-Modus 0, die Klasse
       .safe-area-top behaelt dadurch nur ihren eigenen Sockel (--sa-base-top) - in
       Safari wirkt der Inset weiterhin. Die randlose Optik unter der Statusleiste
       entfaellt, was bei unseren deckenden Kopfzeilen nicht auffaellt. Unten bleibt
       alles unveraendert: viewport-fit=cover bleibt gesetzt, die App schliesst
       weiterhin direkt mit der Geraetekante ab.

       ACHTUNG: iOS liest diesen Wert nur BEIM INSTALLIEREN des Web-Clips. Die
       Aenderung greift erst, nachdem die App vom Home-Bildschirm entfernt und neu
       ueber "Zum Home-Bildschirm" abgelegt wurde. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Zeiterfassung" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./app-icon.png" />
