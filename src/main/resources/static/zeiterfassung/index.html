<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover ist Pflicht, sonst liefert env(safe-area-inset-*) immer 0
       und der Inhalt landet unter der durchscheinenden iOS-Statusleiste. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#dc2626" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- Hinweis iOS 26: Unabhaengig vom Statusleisten-Stil liegt der Inhalt unter der
       Statusleiste, und iOS legt dort einen Weichzeichner ("scroll edge effect") ueber die
       obersten ~25pt unterhalb der Leiste. Duenner, kleiner Text in diesem Band wirkt
       unscharf. Kopfzeilen setzen deshalb die fette Ueberschrift nach oben und kleinen
       Text (Datum, Untertitel) darunter - siehe DashboardPage/KalenderPage. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zeiterfassung" />
  <meta name="mobile-web-app-capable" content="yes" />
