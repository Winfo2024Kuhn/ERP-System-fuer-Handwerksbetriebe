# ========== PostgreSQL-Profil (Kunden-Installationen) ==========
# Aktiv mit SPRING_PROFILES_ACTIVE=docker,postgres (siehe deployment/docker-server).
# Der eigene Produktivserver laeuft weiter auf MySQL - beide Datenbanken werden
# unterstuetzt. Hibernate erkennt den Dialekt selbst an der JDBC-URL.
spring.datasource.url=${APP_DB_URL:jdbc:postgresql://postgres:5432/kalkulationsprogramm_db}

# "SET NAMES utf8mb4" ist MySQL-Syntax - hier das PostgreSQL-Gegenstueck.
spring.datasource.hikari.connectionInitSql=SET client_encoding TO 'UTF8'

# Eigene Migrationslinie: Neuinstallationen bekommen zuerst db/postgresql/basis
# (FlywayStartSetupConfig), danach laufen die Migrationen aus diesem Ordner.
# Jede neue MySQL-Migration braucht hier ihr Gegenstueck mit derselben Nummer
# (geprueft von PostgresMigrationslinieTest).
spring.flyway.locations=classpath:db/postgresql/migration
