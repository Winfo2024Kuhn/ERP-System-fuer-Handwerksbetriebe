# DevTools: Restart deaktivieren während E-Mail-Import läuft (lange IMAP-Operationen)
spring.devtools.restart.enabled=false

spring.application.name=Kalkulationsprogramm
spring.profiles.active=local

# ========== Authentifizierung ==========
# Bootstrap-Admin für das Frontend-Login (wird beim ersten Start angelegt, falls noch kein Login-Benutzer existiert):
#   Windows (PowerShell):  $env:APP_ADMIN_USER="meinUser"; $env:APP_ADMIN_PASS="meinPasswort"
#   Linux/macOS:           export APP_ADMIN_USER=meinUser APP_ADMIN_PASS=meinPasswort
app.admin.username=${APP_ADMIN_USER:}
app.admin.password=${APP_ADMIN_PASS:}

# Datenbank: PostgreSQL (einzige Datenbank; Credentials in application-local.properties oder per ENV)
spring.datasource.url=${APP_DB_URL:jdbc:postgresql://localhost:5432/kalkulationsprogramm_db}
spring.datasource.username=${APP_DB_USER:OVERRIDE_IN_LOCAL}
spring.datasource.password=${APP_DB_PASS:OVERRIDE_IN_LOCAL}
server.port=8080
# Antworten gepackt senden (gzip): Das Haupt-Bundle schrumpft von ~3,6 MB auf ~1 MB, das zaehlt
# von unterwegs ueber Tailscale. Erst ab 1 KB, darunter lohnt es nicht.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,image/svg+xml,application/manifest+json
server.compression.min-response-size=1KB
# Relative Weiterleitungen: Hinter tailscale serve/Funnel kommt die Anfrage intern als http an,
# absolute Weiterleitungen zeigten sonst auf http:// statt https://.
server.tomcat.use-relative-redirects=true
# Login-Cookie nur bei Aufrufen aus dem ERP und bei angeklickten Links ins ERP mitsenden, nie bei
# Anfragen fremder Webseiten im Hintergrund (ohne Angabe senden Firefox/Safari es ueberall mit).
server.servlet.session.cookie.same-site=lax
# Fremde Webseiten, die im Browser Daten aus /api/** lesen (nicht aendern) duerfen.
# Die eigene Oberflaeche (PC und Handy-App) und die Website (/api/internal/**, Server zu Server)
# brauchen keinen Eintrag. Nur genaue Adressen, kommagetrennt, z. B. https://intranet.firma.de -
# kein "*". Die Anmeldung geht nur mit, wenn die Seite unter derselben Domain laeuft wie das ERP;
# die Seite muss einfache GETs ohne eigene Header schicken.
# Standard: leer = keine fremde Webseite.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
#Backups
# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Java-Enums liegen in PostgreSQL als VARCHAR-Spalten, ohne CHECK mit Werteliste
# (neue Enum-Werte sollen keine Migration brauchen). Siehe BACKEND_ARCH.md.
# Nicht setzen: spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type - die
# Property gibt es erst ab Hibernate 6.5 (wir: 6.4.4) und wuerde beim Upgrade
# unbemerkt wirksam.
logging.level.org.hibernate.SQL=OFF
# Flyway: Neuinstallationen bekommen zuerst db/postgresql/basis (FlywayStartSetupConfig),
# danach die Migrationen. Ordnername bleibt - die Flyway-Historie der laufenden
# Installationen haengt daran (siehe FlywayMigrationenTest).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/postgresql/migration
spring.flyway.out-of-order=true
# Bewusst aus, NICHT einschalten: Die Historie des eigenen Servers kann Eintraege aus
# der MySQL-Zeit (bis V406) enthalten, zu denen es hier keine Datei gibt - mit Pruefung
# scheiterte dann jeder Start und das Nachtupdate rollte zurueck. Dass sich keine Migration aendert,
# prueft stattdessen FlywayMigrationenTest (festgeschriebene Checksummen).
spring.flyway.validate-on-migrate=false
# Upload-Konfiguration
hicad.local-path=${user.dir}/uploads/CADdrawings
hicad.network-url=OVERRIDE_IN_LOCAL
hicad.network-drive-letter=Z:

file.upload-dir=${user.dir}/uploads
file.mail-attachment-dir=${user.dir}/uploads/attachments
file.supplier-mail-attachment-dir=${user.dir}/uploads/attachments/lieferanten
file.image-upload-dir=${user.dir}/uploads/images
file.offer-upload-dir=${user.dir}/uploads/offers
file.cutaway_images-dir=${user.dir}/uploads/cutaway_images

# Ordner, in den die naechtliche Sicherung und das Nachtupdate ihr Ergebnis schreiben
# (deployment/docker-server). Leer = keine Meldungen dazu in den Benachrichtigungen.
erp.betriebsstatus.ordner=

# Adresse und Zugang der Ordner-Freigabe aus dem Docker-Paket (Dienst dateifreigabe,
# deployment/docker-server). Leer = keine; dann gilt nur die Netzwerk-Adresse aus den Einstellungen.
erp.dateifreigabe.datei=

spring.servlet.multipart.max-file-size=15GB
spring.servlet.multipart.max-request-size=15GB
# Tomcat 11 (Spring Boot 4) begrenzt sonst auf 50 Teile je Upload und 512 Byte Kopf je Teil.
# Der Dokument-Upload schickt alle gewaehlten Dateien (z. B. 80 Baustellenfotos) in einer Anfrage,
# lange Dateinamen mit Umlauten brauchen mehr als 512 Byte.
server.tomcat.max-part-count=1000
server.tomcat.max-part-header-size=8KB
# Info: Die Anwendung ist unter http://localhost:8080 erreichbar (server.port oben)

# Zeiterfassung PWA Base-URL (für QR-Code Generierung, Override in application-local.properties)
zeiterfassung.base-url=https://localhost

# Schutz vor DNS-Rebinding: Aus dem eigenen Netz nimmt das ERP nur Adressen an, die eine fremde
# Webseite nicht auf das ERP umbiegen kann - IP-Adressen, localhost, Namen ohne Punkt, *.ts.net,
# *.fritz.box, *.local, *.internal, *.lan und weitere lokale Endungen, den Rechnernamen und die
# Adresse aus zeiterfassung.base-url. Eine eigene Domain, die im Büronetz direkt aufs ERP zeigt, hier eintragen
# (kommagetrennt, z. B. erp.firma.de,*.firma.de). * schaltet die Prüfung ab. Docker: app.env,
# APP_SECURITY_ALLOWEDHOSTS. Siehe docs/MOBILE_TOKEN_SECURITY.md, "Erlaubte Adressen".
app.security.allowed-hosts=

# SMTP- und IMAP-Zugangsdaten werden zur Laufzeit über die UI
# (System-Einstellungen → E-Mail-Konto) gepflegt und in der Tabelle
# system_setting gespeichert. Hier KEINE Defaults mehr setzen.
# Encoding configuration
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
spring.datasource.hikari.connectionInitSql=SET client_encoding TO 'UTF8'
# READ COMMITTED (Standard in PostgreSQL) ausdruecklich fuer jede Verbindung
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.properties.hibernate.connection.isolation=2
# Open-in-View registriert OpenEntityManagerInViewConfig selbst - ohne die
# SSE-Live-Strecken, die sonst je eine DB-Verbindung bis zu 30 Min festhalten.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Standard E-Mail-Signatur (HTML, %s wird durch den Benutzernamen ersetzt)


ai.email.enabled=true

# Setze auf false, um KI zu deaktivieren
# ai.email.enabled=false

# Email-Features (Import, Cleanup, Vendor-Abruf) komplett deaktivieren
# Auf true setzen, um Email-Scheduled-Tasks wieder zu aktivieren
email.features.enabled=false

##
## Ollama Cloud (OpenAI-kompatibel)
##
# ai.email.provider=ollama-cloud
# ai.email.url=https://api.ollama.com/v1/chat/completions   # optional, Standard
# ai.email.model=gpt-oss:120b                              # Beispielmodell
#
# API-SchlÃ¼ssel NICHT hier eintragen. Stattdessen als Umgebungsvariable setzen:
#   Windows (PowerShell):   $env:OLLAMA_API_KEY="<dein key>"
#   Linux/macOS (bash):     export OLLAMA_API_KEY="<dein key>"
#

# ========== GEMINI Scanner & PDF ==========
# API Key wird zur Laufzeit über die UI (System-Einstellungen → KI Gemini)
# gepflegt und in der Tabelle system_setting gespeichert.

# Separate Modelle pro Service (latest = immer das neueste Modell)
ai.gemini.model.dokument-analyse=gemini-3.8-flash
ai.gemini.model.scanner=gemini-3.8-flash
ai.gemini.model.pdf-extractor=gemini-3.8-flash
ai.gemini.model.pro=gemini-3.8-flash
# Spracheingabe der mobilen Zeiterfassung (Diktat -> Text, ein Aufruf)
ai.gemini.model.spracheingabe=gemini-3.8-flash
# E-Mail KI (Beautify/Korrektur)
ai.email.model=gemini-3.5-flash-lite

# KI-Hilfe Chat Modell (gemini-flash-latest unterstuetzt Google Search Grounding)
ai.ki-hilfe.model=gemini-3.8-flash
ai.ki-hilfe.web-search-enabled=true

# Email-Zuordnung (Klassifizierung eingehender Mails zu Projekten/Anfragen)
# Bewusst leichtgewichtiges Modell – Klassifizierung muss schnell + guenstig sein.
ai.gemini.model.email-classification=gemini-3.5-flash-lite

# ========== Lokales Ollama (nicht mehr fuer Email-Zuordnung genutzt) ==========
ai.ollama.enabled=true
ai.ollama.url=http://localhost:11434
ai.ollama.model=qwen3:8b
ai.ollama.timeout=120

# ========== RAG / Wissen der KI-Hilfe (Hybrid-Suche im Prozess) ==========
# Entwicklung: Beim Start werden Doku und Quellcode in Abschnitte zerlegt; nur neue/geaenderte
# Abschnitte werden mit dem Gemini-Key aus den System-Einstellungen eingebettet.
# Im Docker-Image liegt kein Quellcode - dort kommt die fertige RAG-Datei aus dem Image-Bau
# (application-docker.properties, RAG_INDEXING.md).
# Gesucht wird nach Bedeutung (Vektor) und nach Woertern; reicht das der KI nicht, schlaegt sie
# selbst nach (Werkzeuge, hoechstens 4 Runden). top-k = Abschnitte der ersten, automatischen Suche.
ai.rag.enabled=true
ai.rag.top-k=8
ai.rag.score-threshold=0.3
# RAG-Datei; leer = .rag-cache.json im Projektordner (gitignored)
ai.rag.datei=

# HikariCP Timeouts für lange KI-Anfragen
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========== VENDOR INVOICE INTEGRATION ==========
# Microsoft Azure Billing API (für Azure/M365 Rechnungen)
vendor.microsoft.enabled=false
vendor.microsoft.tenant-id=
vendor.microsoft.client-id=
vendor.microsoft.client-secret=
vendor.microsoft.billing-account-id=

# Amazon Business Reconciliation API (für Amazon Rechnungen)
vendor.amazon.enabled=false
vendor.amazon.client-id=
vendor.amazon.client-secret=
vendor.amazon.refresh-token=
vendor.amazon.region=EU

# Apple: Keine API verfügbar - Rechnungen via E-Mail (GlobalEmailWatcher)

# Jackson: LocalDate als ISO-String statt Array serialisieren
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
# Jackson 3 mit den Standardwerten wie unter Spring Boot 3 (Jackson 2): z. B. null fuer
# int/boolean-Felder im Request bleibt erlaubt, Felder behalten ihre Reihenfolge.
spring.jackson.use-jackson2-defaults=true

# Enable Legacy Ant Path Matcher for Regex support in URLs (e.g. /zeiterfassung/**/{path:[^\.]*})
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ========== CLOUDFLARE ACCESS (Funnel-Endpoint /api/internal/**) ==========
# Aktiviert die JWT-Verifikation für Anfragen aus dem Marketing-Webseiten-Funnel.
# Lokal/im Dev: enabled=false (Default). In Produktion auf true setzen.
# - team-domain: <name>.cloudflareaccess.com (aus dem CF Zero Trust Dashboard)
# - application-aud: AUD-Tag der CF-Access-Application (Settings → Overview)
cloudflare.access.enabled=${CF_ACCESS_ENABLED:false}
cloudflare.access.team-domain=${CF_ACCESS_TEAM_DOMAIN:}
cloudflare.access.application-aud=${CF_ACCESS_APPLICATION_AUD:}

# ========== WEBSITE → ERP (Schnittstelle /api/internal/**) ==========
# Gemeinsamer Schlüssel zwischen Firmen-Website und ERP. Die Website sendet ihn im Header
# X-ERP-Website-Key (dort: ERP_INTERNAL_API_KEY). Ohne Schlüssel antwortet /api/internal/**
# mit 401 (Anfrage-Formular, Freigabe-Seite und Analytics-Snapshot gehen dann nicht).
# Erzeugen z.B. mit: openssl rand -base64 32
website.internal-api.key=${WEBSITE_INTERNAL_API_KEY:}

# ========== WEBSITE BEITRÄGE API (Anbindung an Marketing-Website) ==========
# Adresse der Website fuer die Beitraege-API. Gegenstueck zum ERP_BASE_URL der
# Website, zeigt in der Regel auf deren Tailscale-Adresse. Muss https sein.
# Leer lassen, dann wird die Website aus den Firmendaten verwendet.
website.beitraege.base-url=${WEBSITE_BEITRAEGE_BASE_URL:}
# Bearer-Token für die geschützte Beiträge-API der Website
website.beitraege.api-token=${WEBSITE_BEITRAEGE_API_TOKEN:}

# ========== WEB PUSH NOTIFICATIONS (VAPID) ==========
# Für iOS PWA Lock-Screen Benachrichtigungen bei Kalendereinträgen
# Generiere Keys mit: java -cp target/classes org.example.kalkulationsprogramm.service.VapidKeyGenerator
push.vapid.public-key=${PUSH_VAPID_PUBLIC_KEY:}
push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY:}
push.vapid.subject=${PUSH_VAPID_SUBJECT:mailto:admin@example.org}

# ========== HEALTH-CHECK (Spring Boot Actuator) ==========
# Das Nachtupdate (deployment/docker-server/nachtupdate.sh) fragt nach dem
# Containerwechsel /actuator/health ab: 200 = neue Version laeuft, sonst
# Rollback. Bewusst NUR der Health-Endpoint, ohne Details - alles andere
# (env, beans, heapdump ...) wuerde Konfiguration und Interna preisgeben.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Ein nicht erreichbarer Mailserver ist kein Grund, ein Update zurueckzurollen.
management.health.mail.enabled=false

# Spring Boot 4 schaltet Liveness/Readiness-Probes ein (Kubernetes). Brauchen wir nicht;
# /actuator/health bleibt so wie bisher ({"status":"UP"} fuer das Nachtupdate).
management.endpoint.health.probes.enabled=false
