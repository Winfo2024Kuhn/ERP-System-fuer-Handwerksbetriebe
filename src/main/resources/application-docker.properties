# ========== Docker Profile ==========
# Diese Datei wird automatisch geladen wenn spring.profiles.active=docker

# Datenbank-Verbindung: PostgreSQL-Container "postgres" (deployment/docker-server)
spring.datasource.url=${APP_DB_URL:jdbc:postgresql://postgres:5432/kalkulationsprogramm_db}
spring.datasource.username=${APP_DB_USER:erp_user}
spring.datasource.password=${APP_DB_PASS:CHANGE_ME_DB_PW}

# Warte auf Datenbankverbindung (Container-Startup kann dauern)
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.connection-timeout=30000

# Upload-Pfade (Docker Volume)
file.upload-dir=/app/uploads
file.mail-attachment-dir=/app/uploads/attachments
file.supplier-mail-attachment-dir=/app/uploads/attachments/lieferanten
file.image-upload-dir=/app/uploads/images
file.offer-upload-dir=/app/uploads/offers
file.cutaway_images-dir=/app/uploads/cutaway_images
hicad.local-path=/app/uploads/CADdrawings
hicad.network-url=
hicad.network-drive-letter=

# Ergebnis von naechtlicher Sicherung und Nachtupdate (nur lesend eingebunden,
# siehe deployment/docker-server/docker-compose.yml)
erp.betriebsstatus.ordner=/app/betriebsstatus

# Ordner-Freigabe (Dienst dateifreigabe): Adresse und Zugang, nur lesend eingebunden.
# Fehlt die Datei, laeuft die Freigabe nicht.
erp.dateifreigabe.datei=/app/dateifreigabe/dateifreigabe.json

# DevTools im Docker-Container deaktivieren
spring.devtools.restart.enabled=false

# Wissen der KI-Hilfe: Die RAG-Datei erzeugt GitHub beim Image-Bau (docker-image.yml) und legt
# sie ins Image - mit jedem Nachtupdate kommt die aktuelle. Fehlt sie, antwortet die KI-Hilfe
# ohne Programmwissen. Der Server bettet selbst nichts ein, nur die Fragen (Gemini-Key des Betriebs).
ai.rag.enabled=true
ai.rag.datei=/app/ki-hilfe/rag-cache.json
ai.email.enabled=false
email.features.enabled=false

# SMTP, IMAP und Gemini API Key werden zur Laufzeit über die UI
# (System-Einstellungen) gepflegt und in der Datenbank (system_setting) gespeichert.
# Hier KEINE Defaults oder Umgebungsvariablen-Mappings mehr setzen.

# Zeiterfassung Base-URL
zeiterfassung.base-url=${ZEITERFASSUNG_URL:http://localhost:8080}
