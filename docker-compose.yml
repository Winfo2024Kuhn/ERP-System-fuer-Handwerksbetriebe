services:

  # ========== MySQL Datenbank ==========
  # MySQL 8.0, weil der Produktivserver darauf laeuft. Eine andere Engine
  # lokal (frueher MariaDB) hiess: Migrationen wurden gegen etwas anderes
  # getestet als sie spaeter ausfuehren, und Dumps mussten bei jedem Import
  # umgeschrieben werden (utf8mb4_0900_ai_ci kennt MariaDB nicht).
  mysql:
    image: mysql:8.0
    container_name: kalkulationsprogramm-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ROOT_PW}
      MYSQL_DATABASE: kalkulationsprogramm_db
      MYSQL_USER: ${MYSQL_USER:-erp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_DB_PW}
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ROOT_PW}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ========== Spring Boot Anwendung ==========
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kalkulationsprogramm-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_DB_URL: ${APP_DB_URL:-jdbc:mysql://mysql:3306/kalkulationsprogramm_db?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
      APP_DB_USER: ${APP_DB_USER:-erp_user}
      APP_DB_PASS: ${APP_DB_PASS:-CHANGE_ME_DB_PW}
      MYSQL_USER: ${MYSQL_USER:-erp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_DB_PW}
      APP_ADMIN_USER: ${APP_ADMIN_USER:-}
      APP_ADMIN_PASS: ${APP_ADMIN_PASS:-}
      WEBSITE_BEITRAEGE_API_TOKEN: ${WEBSITE_BEITRAEGE_API_TOKEN:-}
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ========== Qdrant (Vektordatenbank für KI/RAG) ==========
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: kalkulationsprogramm-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

volumes:
  mysql_data:
  app_uploads:
  app_logs:
  qdrant_data:
