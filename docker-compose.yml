services:

  # ========== PostgreSQL Datenbank ==========
  # PostgreSQL 16 wie auf allen Servern (deployment/docker-server). Eine leere
  # Datenbank richtet die App beim ersten Start selbst ein (Basis-Schema +
  # Migrationen). Port nur auf diesem Rechner (127.0.0.1), z. B. fuer ein
  # Datenbank-Werkzeug.
  postgres:
    image: postgres:16
    container_name: kalkulationsprogramm-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: kalkulationsprogramm_db
      POSTGRES_USER: ${DB_USER:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_DB_PW}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      TZ: Europe/Berlin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ========== Spring Boot Anwendung ==========
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kalkulationsprogramm-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Ohne TZ läuft die JVM in UTC: gestempelte Zeiten lägen zwei Stunden daneben
      TZ: Europe/Berlin
      # Standard: der Dienst "postgres" oben. Fuer ein PostgreSQL woanders nur
      # APP_DB_URL setzen (DB_USER/DB_PASSWORD gelten dann dafuer).
      APP_DB_URL: ${APP_DB_URL:-jdbc:postgresql://postgres:5432/kalkulationsprogramm_db}
      APP_DB_USER: ${DB_USER:-erp_user}
      APP_DB_PASS: ${DB_PASSWORD:-CHANGE_ME_DB_PW}
      APP_ADMIN_USER: ${APP_ADMIN_USER:-}
      APP_ADMIN_PASS: ${APP_ADMIN_PASS:-}
      WEBSITE_BEITRAEGE_API_TOKEN: ${WEBSITE_BEITRAEGE_API_TOKEN:-}
      FREIGABE_PUBLIC_BASE_URL: ${FREIGABE_PUBLIC_BASE_URL:-}
      # Adresse im QR-Code der Handy-App; fürs echte Handy die LAN-Adresse dieses Rechners
      ZEITERFASSUNG_URL: ${ZEITERFASSUNG_URL:-http://localhost:8080}
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ========== Qdrant (Vektordatenbank für KI/RAG) ==========
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: kalkulationsprogramm-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST API, nur auf diesem Rechner
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

volumes:
  postgres_data:
  app_uploads:
  app_logs:
  qdrant_data:
