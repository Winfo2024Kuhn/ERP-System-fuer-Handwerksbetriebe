# =============================================================================
# ERP Handwerk - Betrieb beim Kunden (Linux-Server oder Windows-PC mit Docker)
# =============================================================================
# Einmal einrichten (legt .env mit Zufallspasswoertern an):
#   Windows:  Einrichten.cmd doppelklicken
#   Linux:    sudo ./einrichten.sh
# Danach genuegt jederzeit:   docker compose up -d
#
#   postgres   Die Datenbank (PostgreSQL 16). Eine leere Datenbank richtet die
#              App beim ersten Start selbst ein (Basis-Schema + Stammdaten).
#   app        Das ERP. Kommt als fertiges Image aus der GitHub Container Registry.
#   updater    Spielt jede Nacht um 3 Uhr neue Versionen ein - mit Sicherung,
#              Health-Check und automatischem Rollback (nachtupdate.sh).
#   netzsperre Trennt das ERP vom Firmennetz (netzsperre/sperre.sh).
#
# Abschottung (README, Abschnitt "Sicherheit"):
#   - Die Datenbank haengt nur im Netz "intern" - ohne Verbindung nach aussen,
#     erreichbar nur fuer die App.
#   - Die App laeuft als Benutzer ohne Rechte, mit schreibgeschuetztem
#     Dateisystem (nur Uploads, Logs und /tmp beschreibbar) und ohne
#     Linux-Berechtigungen. Sie bekommt keinen Docker-Socket.
#   - Aus ihrem Netz "extern" darf die App ins Internet, aber nicht ins
#     Firmennetz (ausser NETZSPERRE_AUSNAHMEN, z. B. die FRITZ!Box).
#
# restart: always - nach jedem Neustart des Rechners (bzw. von Docker) laufen
# alle Dienste wieder von selbst an, auch wenn sie vorher gestoppt waren.
#
# Wichtig: "docker compose pull" fuer die App NICHT von Hand ausfuehren. Welche
# App-Version laeuft, steuert nachtupdate.sh ueber das lokale Image-Tag; ein
# Pull am Skript vorbei wuerde beim naechsten Neustart ohne Sicherung wechseln.
#
# Zugangsdaten stehen in .env (Vorlage: .env.example, nie committen).
# =============================================================================

name: erp-handwerk

services:

  postgres:
    image: postgres:16
    container_name: erp-postgres
    environment:
      POSTGRES_DB: kalkulationsprogramm_db
      # Superuser nur fuer Wartung, Sicherung und Rueckspielen (Nachtupdate).
      # Das ERP selbst verbindet sich mit einer eigenen Rolle ohne Superuser-
      # Rechte (postgres-init/01-app-rolle.sh legt sie beim ersten Start an).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD fehlt in .env - zuerst einrichten}
      ERP_DB_USER: ${DB_USER:-erp_user}
      ERP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env - zuerst einrichten}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      TZ: Europe/Berlin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # Verbindungen eines abgestuerzten/entfernten App-Containers nicht stundenlang
    # mit offenen Sperren stehen lassen (TCP merkt das sonst erst nach ~2 h).
    command: >
      postgres
      -c tcp_keepalives_idle=60
      -c idle_in_transaction_session_timeout=10min
    # Kein Port nach aussen und nur im Netz "intern": nur die App spricht mit
    # der Datenbank. Fuer Wartung: docker compose exec postgres psql -U postgres kalkulationsprogramm_db
    networks: [intern]
    # Nur, was das Startskript des Images braucht (Datenordner dem Benutzer
    # "postgres" geben, dann zu ihm wechseln) - danach laeuft der Server ohne Rechte.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  app:
    image: ${ERP_IMAGE:-ghcr.io/winfo2024kuhn/erp-system-fuer-handwerksbetriebe:stable}
    # Nur holen, wenn noch gar nicht vorhanden (Ersteinrichtung). Danach
    # wechselt ausschliesslich nachtupdate.sh die Version.
    pull_policy: missing
    container_name: erp-app
    ports:
      # APP_ADRESSE=127.0.0.1: nur von diesem Rechner aus erreichbar (z. B. wenn
      # tailscale serve davor sitzt). Standard 0.0.0.0 = im ganzen Firmennetz.
      - "${APP_ADRESSE:-0.0.0.0}:${APP_PORT:-8080}:8080"
    # Weitere Einstellungen des ERP (API-Schluessel, Funktionen, ...) als
    # Umgebungsvariablen, z. B. AI_GEMINI_APIKEY=... - Datei ist optional.
    env_file:
      - path: ./app.env
        required: false
    environment:
      # "docker" verbindet die App mit dem Dienst "postgres" oben
      # (application-docker.properties). "postgres" brauchen nur noch App-
      # Versionen von vor Oktober 2026 (z. B. bei einem Rollback auf eine
      # alte Version) - neuere ignorieren es. Kann weg, sobald keine so alte
      # Version mehr zurueckkommen kann.
      SPRING_PROFILES_ACTIVE: docker,postgres
      APP_DB_USER: ${DB_USER:-erp_user}
      APP_DB_PASS: ${DB_PASSWORD}
      APP_ADMIN_USER: ${APP_ADMIN_USER:-}
      APP_ADMIN_PASS: ${APP_ADMIN_PASS:-}
      ZEITERFASSUNG_URL: ${ZEITERFASSUNG_URL:-http://localhost:8080}
      # = freigabe.public-base-url (Spring liest Umgebungsvariablen ohne "-")
      FREIGABE_PUBLICBASEURL: ${FREIGABE_PUBLIC_BASE_URL:-}
      # ja = einem Proxy auf diesem Rechner (tailscale serve, cloudflared) die
      # Absender-Adresse glauben. Nur zusammen mit APP_ADRESSE=127.0.0.1!
      ERP_LOKALER_PROXY: ${LOKALER_PROXY:-nein}
      # Ortszeit wie auf dem bisherigen Windows-Server (JDBC bleibt wie dort auf UTC)
      TZ: Europe/Berlin
    volumes:
      # UPLOADS_ORDNER: vorhandener Ordner auf dem Rechner statt Docker-Volume,
      # z. B. wenn er im Firmennetz freigegeben ist (CAD-Zeichnungen).
      - ${UPLOADS_ORDNER:-app_uploads}:/app/uploads
      - app_logs:/app/logs
    networks: [intern, extern]
    # Schreibgeschuetzt: Wer eine Luecke findet, kann weder das ERP noch das
    # System im Container veraendern. Beschreibbar sind nur die Volumes oben und
    # /tmp. "exec" auf /tmp ist noetig: OpenCV (Bildbearbeitung) entpackt beim
    # Start seine native Bibliothek dorthin und laedt sie von dort.
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777,exec
    # CHOWN/SETUID/SETGID braucht nur das Startskript (Datenordner uebernehmen,
    # dann zum Benutzer "erp" wechseln). Java selbst laeuft ohne jede Berechtigung.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    # Erst starten, wenn die Datenbank bereit ist
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  updater:
    build: ./updater
    image: erp-updater:lokal
    container_name: erp-updater
    environment:
      TZ: Europe/Berlin
      # Aus Sicht des Updaters heisst die App "app" (Docker-Netz), nicht localhost
      HEALTH_URL: http://app:8080/actuator/health
      # Sperre im Container statt im Projektordner: Datei-Sperren funktionieren
      # auf eingebundenen Windows-Ordnern nicht zuverlaessig
      LOCK_DATEI: /run/erp-nachtupdate.lock
      UPDATE_ZEITPLAN: ${UPDATE_ZEITPLAN:-0 3 * * *}
    volumes:
      # Steuert die Container dieses Projekts. Wer den Socket hat, hat volle
      # Kontrolle ueber Docker - deshalb tut der Updater nur, was in
      # nachtupdate.sh steht, hat keinen Port und ist von aussen nicht
      # erreichbar. Die App selbst bekommt den Socket nie.
      - /var/run/docker.sock:/var/run/docker.sock
      # Projektordner: Skripte, .env, sicherungen/, logs/
      - .:/erp
    networks: [extern]
    security_opt: [no-new-privileges:true]
    restart: always

  netzsperre:
    build: ./netzsperre
    image: erp-netzsperre:lokal
    container_name: erp-netzsperre
    # Setzt Firewall-Regeln im Netz des Rechners (bzw. der Docker-Desktop-VM)
    network_mode: host
    environment:
      TZ: Europe/Berlin
      # ja = das ERP erreicht aus dem Firmennetz nur NETZSPERRE_AUSNAHMEN
      NETZSPERRE: ${NETZSPERRE:-ja}
      # ziel:port, Komma-getrennt. Standard: FRITZ!Box (Anrufliste, Anrufbeantworter)
      NETZSPERRE_AUSNAHMEN: ${NETZSPERRE_AUSNAHMEN-fritz.box:49000}
      NETZSPERRE_BRIDGE: erp-extern
    read_only: true
    tmpfs: [/tmp, /run]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    restart: always

networks:
  # Datenbank <-> App. "internal": Docker laesst aus diesem Netz nichts nach aussen.
  intern:
    internal: true
  # App (und Updater) <-> Internet, Port fuer den Browser. Fester Bridge-Name,
  # damit die Netzsperre ihre Regeln genau an dieses Netz haengen kann.
  extern:
    driver_opts:
      com.docker.network.bridge.name: erp-extern

volumes:
  postgres_data:
  app_uploads:
  app_logs:
