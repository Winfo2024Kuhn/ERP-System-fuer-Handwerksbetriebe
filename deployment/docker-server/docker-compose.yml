# =============================================================================
# ERP Handwerk - Betrieb beim Kunden (Linux-Server oder Windows-PC mit Docker)
# =============================================================================
# Einmal einrichten (legt .env mit Zufallspasswoertern an):
#   Windows:  Einrichten.cmd doppelklicken
#   Linux:    sudo ./einrichten.sh
# Danach genuegt jederzeit:   docker compose up -d
#
#   postgres   Die Datenbank (PostgreSQL 16). Eine leere Datenbank richtet die
#              App beim ersten Start selbst ein (Basis-Schema + Stammdaten).
#   app        Das ERP. Kommt als fertiges Image aus der GitHub Container Registry.
#   updater    Sichert jede Nacht um 2 Uhr Datenbank und Uploads - auf diesen
#              Rechner, die externe Festplatte und den Cloud-Ordner (sicherung.sh).
#              Spielt um 3 Uhr neue Versionen ein - mit Sicherung, Health-Check
#              und automatischem Rollback (nachtupdate.sh). Was schiefgeht, sehen
#              Admins im ERP unter "Benachrichtigungen" (Volume betriebsstatus).
#   netzsperre Trennt das ERP vom Firmennetz (netzsperre/sperre.sh).
#   jetzt-aktualisieren
#              Knopf in Docker Desktop: auf Start klicken, und das Update laeuft
#              sofort (wie nachts). Startet nie von allein (Profil "manuell").
#   dateifreigabe
#              Optional (Profil "dateifreigabe", in .env: COMPOSE_PROFILES=
#              dateifreigabe): gibt den Zeichnungs-Ordner der Uploads ueber
#              Tailscale frei - Excel, HiCAD und Tenado oeffnen Dateien dann im
#              Buero und unterwegs direkt, ohne Windows-Freigabe.
#
# Abschottung (README, Abschnitt "Sicherheit"):
#   - Die Datenbank haengt nur im Netz "intern" - ohne Verbindung nach aussen,
#     erreichbar nur fuer die App.
#   - Die App laeuft als Benutzer ohne Rechte, mit schreibgeschuetztem
#     Dateisystem (nur Uploads, Logs und /tmp beschreibbar) und ohne
#     Linux-Berechtigungen. Sie bekommt keinen Docker-Socket.
#   - Aus ihrem Netz "extern" darf die App ins Internet, aber nicht ins
#     Firmennetz (ausser NETZSPERRE_AUSNAHMEN, z. B. die FRITZ!Box).
#
# restart: always - nach jedem Neustart des Rechners (bzw. von Docker) laufen
# alle Dienste wieder von selbst an, auch wenn sie vorher gestoppt waren.
#
# Wichtig: "docker compose pull" fuer die App NICHT von Hand ausfuehren. Welche
# App-Version laeuft, steuert nachtupdate.sh ueber das lokale Image-Tag; ein
# Pull am Skript vorbei wuerde beim naechsten Neustart ohne Sicherung wechseln.
#
# Zugangsdaten stehen in .env (Vorlage: .env.example, nie committen).
# =============================================================================

name: erp-handwerk

services:

  postgres:
    image: postgres:16
    container_name: erp-postgres
    environment:
      POSTGRES_DB: kalkulationsprogramm_db
      # Superuser nur fuer Wartung, Sicherung und Rueckspielen (Nachtupdate).
      # Das ERP selbst verbindet sich mit einer eigenen Rolle ohne Superuser-
      # Rechte (postgres-init/01-app-rolle.sh legt sie beim ersten Start an).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD fehlt in .env - zuerst einrichten}
      ERP_DB_USER: ${DB_USER:-erp_user}
      ERP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env - zuerst einrichten}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      TZ: Europe/Berlin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # Verbindungen eines abgestuerzten/entfernten App-Containers nicht stundenlang
    # mit offenen Sperren stehen lassen (TCP merkt das sonst erst nach ~2 h).
    command: >
      postgres
      -c tcp_keepalives_idle=60
      -c idle_in_transaction_session_timeout=10min
    # Kein Port nach aussen und nur im Netz "intern": nur die App spricht mit
    # der Datenbank. Fuer Wartung: docker compose exec postgres psql -U postgres kalkulationsprogramm_db
    networks: [intern]
    # Nur, was das Startskript des Images braucht (Datenordner dem Benutzer
    # "postgres" geben, dann zu ihm wechseln) - danach laeuft der Server ohne Rechte.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  app:
    image: ${ERP_IMAGE:-ghcr.io/winfo2024kuhn/erp-system-fuer-handwerksbetriebe:stable}
    # Nur holen, wenn noch gar nicht vorhanden (Ersteinrichtung). Danach
    # wechselt ausschliesslich nachtupdate.sh die Version.
    pull_policy: missing
    container_name: erp-app
    ports:
      # APP_ADRESSE=127.0.0.1: nur von diesem Rechner aus erreichbar (z. B. wenn
      # tailscale serve davor sitzt). Standard 0.0.0.0 = im ganzen Firmennetz.
      - "${APP_ADRESSE:-0.0.0.0}:${APP_PORT:-8080}:8080"
    # Weitere Einstellungen des ERP (API-Schluessel, Funktionen, ...) als
    # Umgebungsvariablen, z. B. AI_GEMINI_APIKEY=... - Datei ist optional.
    env_file:
      - path: ./app.env
        required: false
    environment:
      # "docker" verbindet die App mit dem Dienst "postgres" oben
      # (application-docker.properties). "postgres" brauchen nur noch App-
      # Versionen von vor Oktober 2026 (z. B. bei einem Rollback auf eine
      # alte Version) - neuere ignorieren es. Kann weg, sobald keine so alte
      # Version mehr zurueckkommen kann.
      SPRING_PROFILES_ACTIVE: docker,postgres
      APP_DB_USER: ${DB_USER:-erp_user}
      APP_DB_PASS: ${DB_PASSWORD}
      APP_ADMIN_USER: ${APP_ADMIN_USER:-}
      APP_ADMIN_PASS: ${APP_ADMIN_PASS:-}
      ZEITERFASSUNG_URL: ${ZEITERFASSUNG_URL:-http://localhost:8080}
      # = freigabe.public-base-url (Spring liest Umgebungsvariablen ohne "-")
      FREIGABE_PUBLICBASEURL: ${FREIGABE_PUBLIC_BASE_URL:-}
      # ja = einem Proxy auf diesem Rechner (tailscale serve, cloudflared) die
      # Absender-Adresse glauben. Nur zusammen mit APP_ADRESSE=127.0.0.1!
      ERP_LOKALER_PROXY: ${LOKALER_PROXY:-nein}
      # Ortszeit wie auf dem bisherigen Windows-Server (JDBC bleibt wie dort auf UTC)
      TZ: Europe/Berlin
    volumes:
      # UPLOADS_ORDNER: vorhandener Ordner auf dem Rechner statt Docker-Volume,
      # z. B. wenn er im Firmennetz freigegeben ist (CAD-Zeichnungen).
      - ${UPLOADS_ORDNER:-app_uploads}:/app/uploads
      - app_logs:/app/logs
      # Ergebnis von Sicherung und Nachtupdate - nur lesen (Benachrichtigungen).
      # Volume statt ./Ordner: Der Updater erstellt die App selbst neu, ein
      # relativer Pfad zeigte dann ins Leere (siehe UPLOADS_ORDNER).
      - betriebsstatus:/app/betriebsstatus:ro
      # Adresse und Zugang der Ordner-Freigabe (Dienst dateifreigabe) - nur lesen.
      # Leer, solange die Freigabe nicht laeuft.
      - dateifreigabe_status:/app/dateifreigabe:ro
    networks: [intern, extern]
    # Schreibgeschuetzt: Wer eine Luecke findet, kann weder das ERP noch das
    # System im Container veraendern. Beschreibbar sind nur die Volumes oben und
    # /tmp. "exec" auf /tmp ist noetig: OpenCV (Bildbearbeitung) entpackt beim
    # Start seine native Bibliothek dorthin und laedt sie von dort.
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777,exec
    # CHOWN/SETUID/SETGID braucht nur das Startskript (Datenordner uebernehmen,
    # dann zum Benutzer "erp" wechseln). Java selbst laeuft ohne jede Berechtigung.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    # Erst starten, wenn die Datenbank bereit ist
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  updater:
    build: ./updater
    image: erp-updater:lokal
    container_name: erp-updater
    environment:
      TZ: Europe/Berlin
      # Aus Sicht des Updaters heisst die App "app" (Docker-Netz), nicht localhost
      HEALTH_URL: http://app:8080/actuator/health
      # Sperre im Container statt im Projektordner: Datei-Sperren funktionieren
      # auf eingebundenen Windows-Ordnern nicht zuverlaessig
      LOCK_DATEI: /run/erp-nachtupdate.lock
      UPDATE_ZEITPLAN: ${UPDATE_ZEITPLAN:-0 3 * * *}
      SICHERUNG_ZEITPLAN: ${SICHERUNG_ZEITPLAN:-0 2 * * *}
      BETRIEBSSTATUS_DIR: /betriebsstatus
      # Welche Sicherungsziele beim Erstellen dieses Containers eingebunden
      # wurden. Steht in der .env inzwischen etwas anderes, meldet sicherung.sh
      # "noch nicht eingebunden" statt in den leeren Platzhalter zu sichern.
      SICHERUNG_PLATTE_EINGEBUNDEN: ${SICHERUNG_PLATTE:-}
      SICHERUNG_CLOUD_EINGEBUNDEN: ${SICHERUNG_CLOUD:-}
      # Dasselbe fuer die Uploads: Nach einem Umzug (dateifreigabe.sh --umziehen)
      # sichert ein Updater, der noch den alten Ordner eingebunden hat, nicht
      # weiter von dort, sondern meldet "noch nicht eingebunden".
      UPLOADS_ORDNER_EINGEBUNDEN: ${UPLOADS_ORDNER:-}
    volumes:
      # Steuert die Container dieses Projekts. Wer den Socket hat, hat volle
      # Kontrolle ueber Docker - deshalb tut der Updater nur, was in
      # nachtupdate.sh und sicherung.sh steht, hat keinen Port und ist von
      # aussen nicht erreichbar. Die App selbst bekommt den Socket nie.
      - /var/run/docker.sock:/var/run/docker.sock
      # Projektordner: Skripte, .env, sicherungen/, logs/
      - .:/erp
      # Ergebnis fuer die Benachrichtigungen im ERP (die App liest es nur)
      - betriebsstatus:/betriebsstatus
      # Fuer die taegliche Sicherung: hochgeladene Dateien (nur lesen) und die
      # Ziele aus der .env. Nicht eingetragen = leerer Platzhalter, den
      # sicherung.sh nicht benutzt.
      - ${UPLOADS_ORDNER:-app_uploads}:/uploads:ro
      - ${SICHERUNG_PLATTE:-./.status/kein-sicherungsziel}:/sicherungsziele/platte
      - ${SICHERUNG_CLOUD:-./.status/kein-sicherungsziel}:/sicherungsziele/cloud
    networks: [extern]
    security_opt: [no-new-privileges:true]
    restart: always

  # Knopf "Jetzt aktualisieren": In Docker Desktop auf Start klicken, und das
  # Update laeuft sofort (derselbe Ablauf wie nachts: sichern, wechseln,
  # pruefen, bei Fehler zurueck). Der Container tut nichts anderes, als im
  # Updater update-jetzt.sh aufzurufen; die Update-Logik liegt allein dort.
  # Profil "manuell": "docker compose up" startet ihn NICHT. Angelegt wird er
  # vom Updater bei jedem Start (updater/start.sh), er steht also nach der
  # Einrichtung ohne weiteren Befehl in der Liste. Nach dem Lauf beendet er
  # sich; ein weiterer Klick auf Start wiederholt das Update.
  jetzt-aktualisieren:
    image: erp-updater:lokal
    pull_policy: never
    container_name: erp-jetzt-aktualisieren
    profiles: [manuell]
    # Startet den Updater, falls er gerade steht, und zeigt dessen Ausgabe
    entrypoint:
      - sh
      - -c
      - docker start erp-updater >/dev/null 2>&1; exec docker exec erp-updater bash /erp/updater/update-jetzt.sh
    environment:
      TZ: Europe/Berlin
    volumes:
      # Nur fuer "docker exec" auf den Updater (wie beim Updater selbst: Wer den
      # Socket hat, steuert Docker). Kein Port, kein Netz, keine eigenen Dateien.
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    security_opt: [no-new-privileges:true]
    # Stop soll sofort greifen (nicht erst nach 10 s), und die Logs aller Klicks
    # sammeln sich nicht unbegrenzt an
    init: true
    logging:
      driver: json-file
      options:
        max-size: 1m
    restart: "no"

  netzsperre:
    build: ./netzsperre
    image: erp-netzsperre:lokal
    container_name: erp-netzsperre
    # Setzt Firewall-Regeln im Netz des Rechners (bzw. der Docker-Desktop-VM)
    network_mode: host
    environment:
      TZ: Europe/Berlin
      # ja = das ERP erreicht aus dem Firmennetz nur NETZSPERRE_AUSNAHMEN
      NETZSPERRE: ${NETZSPERRE:-ja}
      # ziel:port, Komma-getrennt. Standard: FRITZ!Box (49000 = Anrufliste und
      # Anrufbeantworter, 1012 = Anrufmonitor fuer das Anruf-Fenster)
      NETZSPERRE_AUSNAHMEN: ${NETZSPERRE_AUSNAHMEN-fritz.box:49000,fritz.box:1012}
      NETZSPERRE_BRIDGE: erp-extern
    read_only: true
    tmpfs: [/tmp, /run]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    restart: always

  # Ordner-Freigabe fuer "Dateien direkt am PC oeffnen" (README, Abschnitt
  # "Ordner-Freigabe ohne Windows"). Eigenes Geraet im Tailscale-Netz
  # (DATEIFREIGABE_NAME, Standard erp-dateien) mit Samba; erreichbar nur ueber
  # Tailscale, nie im Firmennetz. Einschalten und einrichten in einem Schritt:
  #   docker compose exec updater bash /erp/dateifreigabe.sh
  dateifreigabe:
    build: ./dateifreigabe
    image: erp-dateifreigabe:lokal
    container_name: erp-dateifreigabe
    profiles: [dateifreigabe]
    hostname: ${DATEIFREIGABE_NAME:-erp-dateien}
    environment:
      TZ: Europe/Berlin
      DATEIFREIGABE_NAME: ${DATEIFREIGABE_NAME:-erp-dateien}
      DATEIFREIGABE_ORDNER: ${DATEIFREIGABE_ORDNER:-CADdrawings}
      DATEIFREIGABE_TAG: ${DATEIFREIGABE_TAG-tag:erp-dateien}
      DATEIFREIGABE_PASSWORT: ${DATEIFREIGABE_PASSWORT:-}
      # Nur fuer die erste Anmeldung; danach merkt sich der Container sie im
      # Volume dateifreigabe_daten. Leer = Anmelde-Link im Log.
      TS_AUTHKEY: ${DATEIFREIGABE_TS_AUTHKEY:-}
    volumes:
      # Dieselben Uploads wie das ERP - freigegeben wird nur DATEIFREIGABE_ORDNER
      - ${UPLOADS_ORDNER:-app_uploads}:/daten
      # Tailscale-Anmeldung und das erzeugte Ordner-Passwort
      - dateifreigabe_daten:/var/lib/dateifreigabe
      # Adresse und Zugang fuer das ERP (die App bindet es nur lesend ein)
      - dateifreigabe_status:/status
    # Tailscale braucht ein eigenes Netzwerk-Geraet (tailscale0) ...
    devices:
      - /dev/net/tun:/dev/net/tun
    # ... und einen festen UDP-Port fuer direkte Verbindungen zu den PCs. Ohne
    # ihn laeuft alles ueber die Tailscale-Relais - das geht, ist aber langsamer.
    # 41642 statt 41641: Auf diesem Rechner laeuft oft schon Tailscale selbst.
    ports:
      - "${DATEIFREIGABE_UDP_PORT:-41642}:41642/udp"
    # Eigenes Netz ohne Netzsperre: Tailscale sucht den kuerzesten Weg zu den
    # PCs, im Buero auch direkt im Firmennetz. Samba lauscht trotzdem nur auf
    # tailscale0 (smb.conf), nicht in diesem Netz.
    networks: [dateifreigabe]
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/lib/samba
      - /var/cache/samba
      - /var/log
    # NET_ADMIN/NET_RAW: Tailscale-Netzwerkgeraet und Routen. SETUID/SETGID:
    # Samba wechselt fuer jeden Zugriff zum Benutzer des ERP (Kennung 10001).
    # CHOWN/DAC_OVERRIDE/FOWNER: Ordner anlegen und Dateien der Kennung 10001
    # bearbeiten.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "test -f /status/dateifreigabe.json && nc -z 127.0.0.1 445"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    restart: always

networks:
  # Datenbank <-> App. "internal": Docker laesst aus diesem Netz nichts nach aussen.
  intern:
    internal: true
  # App (und Updater) <-> Internet, Port fuer den Browser. Fester Bridge-Name,
  # damit die Netzsperre ihre Regeln genau an dieses Netz haengen kann.
  extern:
    driver_opts:
      com.docker.network.bridge.name: erp-extern
  # Nur fuer die Ordner-Freigabe (Tailscale ins Internet)
  dateifreigabe:

volumes:
  postgres_data:
  app_uploads:
  app_logs:
  betriebsstatus:
  dateifreigabe_daten:
  dateifreigabe_status:
