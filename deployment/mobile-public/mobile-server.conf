if ($ambiguous_path) { return 400; }
include /etc/nginx/mobile-headers.conf;
error_page 429 = @rate_limited;
location @rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    include /etc/nginx/mobile-headers.conf;
    return 429 '{"error":"Zu viele Anfragen. Bitte kurz warten.","retryAfterSeconds":1}';
}
location = / {
    if ($mobile_method != GET) { return 405; }
    return 302 /zeiterfassung/;
}
location / {
    if ($mobile_allowed = 0) { return 404; }
    limit_req zone=mobile_all burst=100 nodelay;
    limit_req zone=mobile_api burst=30 nodelay;
    limit_req zone=mobile_bilder burst=120 nodelay;
    limit_req zone=mobile_login burst=5 nodelay;
    limit_conn mobile_connections 16;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-ERP-Public-Mobile 1;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie $mobile_cookie;
    proxy_set_header X-XSRF-TOKEN "";
    proxy_hide_header Set-Cookie;
    proxy_pass http://erp;
}
