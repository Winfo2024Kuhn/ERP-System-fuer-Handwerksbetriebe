name: PR Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Run backend tests
        run: ./mvnw test

  pc_lint:
    name: PC Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  pc_unit_tests:
    name: PC Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  pc_build:
    name: PC Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  pc_e2e:
    name: PC Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck E2E tests
        run: npm run typecheck:e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-playwright-report
          path: react-pc-frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  mobile_lint:
    name: Zeiterfassung Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  mobile_unit_tests:
    name: Zeiterfassung Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  mobile_build:
    name: Zeiterfassung Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  mobile_e2e:
    name: Zeiterfassung E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeiterfassung-playwright-results
          path: react-zeiterfassung/test-results
          if-no-files-found: ignore
          retention-days: 7

  quality_gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend_tests
      - pc_lint
      - pc_unit_tests
      - pc_build
      - pc_e2e
      - mobile_lint
      - mobile_unit_tests
      - mobile_build
      - mobile_e2e
    steps:
      - name: Verify all required checks passed
        shell: bash
        run: |
          results=(
            "${{ needs.backend_tests.result }}"
            "${{ needs.pc_lint.result }}"
            "${{ needs.pc_unit_tests.result }}"
            "${{ needs.pc_build.result }}"
            "${{ needs.pc_e2e.result }}"
            "${{ needs.mobile_lint.result }}"
            "${{ needs.mobile_unit_tests.result }}"
            "${{ needs.mobile_build.result }}"
            "${{ needs.mobile_e2e.result }}"
          )

          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "At least one required PR check did not pass."
              printf 'Results: %s\n' "${results[*]}"
              exit 1
            fi
          done

          echo "All required PR checks passed."
