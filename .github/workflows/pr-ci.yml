name: PR Quality Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Run backend tests
        run: ./mvnw test

  # Kunden laufen auf PostgreSQL, der eigene Server auf MySQL: jede @Query
  # muss auf beiden laufen (DatenbankKompatibilitaetTest). Wegwerf-Datenbanken
  # nur fuer diesen Job - die Passwoerter sind keine Geheimnisse.
  db_kompatibilitaet:
    name: Datenbank-Kompatibilitaet (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            url: jdbc:mysql://127.0.0.1:3306/kompat?allowPublicKeyRetrieval=true&useSSL=false
            user: root
          - db: postgresql
            url: jdbc:postgresql://127.0.0.1:5432/kompat
            user: kompat
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: kompat
          MYSQL_DATABASE: kompat
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pkompat"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kompat
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kompat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # Wie beim Kunden: Die App arbeitet mit einer Rolle OHNE Superuser-Rechte
      # (deployment/docker-server/postgres-init/01-app-rolle.sh)
      - name: PostgreSQL-Rolle ohne Superuser-Rechte anlegen
        if: matrix.db == 'postgresql'
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d kompat
          -c "CREATE ROLE kompat LOGIN PASSWORD 'kompat'"
          -c "ALTER DATABASE kompat OWNER TO kompat"
          -c "ALTER SCHEMA public OWNER TO kompat"

      - name: Alle Abfragen gegen ${{ matrix.db }}
        run: >-
          ./mvnw -B test -Dtest=DatenbankKompatibilitaetTest
          "-Dkompat.db.url=${{ matrix.url }}" -Dkompat.db.user=${{ matrix.user }} -Dkompat.db.pass=kompat

      # Der Test ist an -Dkompat.db.url gebunden. Kommt die Property nicht an,
      # waeren alle Tests "uebersprungen" - und der Job trotzdem gruen.
      - name: Pruefen, dass der Test wirklich lief
        shell: bash
        run: |
          bericht=target/surefire-reports/TEST-org.example.kalkulationsprogramm.repository.DatenbankKompatibilitaetTest.xml
          kopf="$(grep -o '<testsuite [^>]*' "$bericht" || true)"
          if [[ -z "$kopf" || "$kopf" != *' skipped="0"'* || "$kopf" == *' tests="0"'* ]]; then
            echo "::error::DatenbankKompatibilitaetTest lief nicht (oder wurde uebersprungen): $kopf"
            exit 1
          fi

  pc_lint:
    name: PC Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  pc_unit_tests:
    name: PC Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  pc_build:
    name: PC Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  pc_e2e:
    name: PC Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck E2E tests
        run: npm run typecheck:e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-playwright-report
          path: react-pc-frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  mobile_lint:
    name: Zeiterfassung Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  mobile_unit_tests:
    name: Zeiterfassung Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  mobile_build:
    name: Zeiterfassung Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  mobile_e2e:
    name: Zeiterfassung E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeiterfassung-playwright-results
          path: react-zeiterfassung/test-results
          if-no-files-found: ignore
          retention-days: 7

  quality_gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend_tests
      - db_kompatibilitaet
      - pc_lint
      - pc_unit_tests
      - pc_build
      - pc_e2e
      - mobile_lint
      - mobile_unit_tests
      - mobile_build
      - mobile_e2e
    steps:
      - name: Verify all required checks passed
        shell: bash
        run: |
          results=(
            "${{ needs.backend_tests.result }}"
            "${{ needs.db_kompatibilitaet.result }}"
            "${{ needs.pc_lint.result }}"
            "${{ needs.pc_unit_tests.result }}"
            "${{ needs.pc_build.result }}"
            "${{ needs.pc_e2e.result }}"
            "${{ needs.mobile_lint.result }}"
            "${{ needs.mobile_unit_tests.result }}"
            "${{ needs.mobile_build.result }}"
            "${{ needs.mobile_e2e.result }}"
          )

          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "At least one required PR check did not pass."
              printf 'Results: %s\n' "${results[*]}"
              exit 1
            fi
          done

          echo "All required PR checks passed."
