name: PR Quality Checks

# Laeuft nur im Pull Request, nicht noch einmal nach dem Merge auf main.
# Das Ruleset fuer main verlangt einen PR, diesen Check ("PR Quality Gate") und
# dass der Branch vor dem Merge aktuell ist; mit linearer Historie ist der Stand
# auf main damit genau der, der hier gruen getestet wurde. Ein zweiter Lauf auf
# main faende nichts Neues, kostete ~25 Minuten bis zum Image und liesse einen
# wackeligen Test das Image blockieren.
# docker-image.yml prueft vor dem Bauen selbst nach, dass der Stand auf main
# aus einem PR mit gruenem "PR Quality Gate" stammt und genau so getestet
# wurde - ein Merge am Ruleset vorbei bekommt also kein Image.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run backend tests
        run: ./mvnw test

  # Die Unit-Tests laufen auf H2 - jede @Query und das echte Schema (Basis +
  # Migrationen) prueft dieser Job gegen PostgreSQL (DatenbankKompatibilitaet*Test).
  # Wegwerf-Datenbank nur fuer diesen Job - das Passwort ist kein Geheimnis.
  db_kompatibilitaet:
    name: Datenbank-Kompatibilitaet (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kompat
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kompat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Wie beim Kunden: Die App arbeitet mit einer Rolle OHNE Superuser-Rechte
      # (deployment/docker-server/postgres-init/01-app-rolle.sh)
      - name: PostgreSQL-Rolle ohne Superuser-Rechte anlegen
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d kompat
          -c "CREATE ROLE kompat LOGIN PASSWORD 'kompat'"
          -c "ALTER DATABASE kompat OWNER TO kompat"
          -c "ALTER SCHEMA public OWNER TO kompat"
          -c "CREATE DATABASE kompat_leer OWNER kompat"

      # Alle DatenbankKompatibilitaet*Test-Klassen (Abfragen + Fehler aus dem Betrieb)
      # sowie service-Tests, die diese Datenbank mitnutzen (KundeDatenschutzPostgresTest, ProduktkategorieLoeschenPostgresTest)
      - name: Alle Abfragen gegen PostgreSQL
        run: >-
          ./mvnw -B test "-Dtest=DatenbankKompatibilitaet*Test,KundeDatenschutzPostgresTest,ProduktkategorieLoeschenPostgresTest"
          "-Dkompat.db.url=jdbc:postgresql://127.0.0.1:5432/kompat" -Dkompat.db.user=kompat -Dkompat.db.pass=kompat

      # Gleichzeitiges Abschliessen/Exportieren (Zeilensperren) - eigene leere
      # Datenbank, weil diese Tests ihr Schema selbst neu anlegen
      - name: Monatsabschluss und DATEV-Export unter Last
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d kompat_leer
          -c "ALTER SCHEMA public OWNER TO kompat"
          && ./mvnw -B test "-Dtest=MonatsabschlussPostgresTest,MonatsabschlussSammelPostgresTest,DatevExportPostgresTest"
          "-Dzeitkonto.pg.url=jdbc:postgresql://127.0.0.1:5432/kompat_leer"
          "-Ddatev.pg.url=jdbc:postgresql://127.0.0.1:5432/kompat_leer"
          -Dkompat.db.user=kompat -Dkompat.db.pass=kompat

      # Die Tests sind an System-Properties gebunden. Kommt eine nicht an, waeren
      # alle Tests "uebersprungen" - und der Job trotzdem gruen. Geprueft wird jede
      # DatenbankKompatibilitaet*Test- und service/*PostgresTest-Klasse, auch kuenftige.
      - name: Pruefen, dass die Tests wirklich liefen
        shell: bash
        run: |
          for quelle in src/test/java/org/example/kalkulationsprogramm/repository/DatenbankKompatibilitaet*Test.java \
                        src/test/java/org/example/kalkulationsprogramm/service/*PostgresTest.java; do
            klasse="$(basename "$quelle" .java)"
            paket="$(basename "$(dirname "$quelle")")"
            bericht="target/surefire-reports/TEST-org.example.kalkulationsprogramm.$paket.$klasse.xml"
            kopf="$(grep -o '<testsuite [^>]*' "$bericht" || true)"
            if [[ -z "$kopf" || "$kopf" != *' skipped="0"'* || "$kopf" == *' tests="0"'* ]]; then
              echo "::error::$klasse lief nicht (oder wurde uebersprungen): $kopf"
              exit 1
            fi
          done

  pc_lint:
    name: PC Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  pc_unit_tests:
    name: PC Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  pc_build:
    name: PC Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  # Rund 1000 Testlaeufe (alle Specs x drei Bildschirmgroessen) auf drei
  # parallele Jobs verteilt. Jeder Job faehrt weiter 2 Worker wie zuvor der
  # eine -- gleiche Last pro Maschine, ein Drittel der Wartezeit. Mehr Teile
  # lohnen kaum: dann bremst die feste Vorlaufzeit (Installation, Build) und
  # die Backend-Tests sind ohnehin ~4,5 Minuten unterwegs.
  pc_e2e:
    name: PC Frontend E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: react-pc-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-pc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck E2E tests
        run: npm run typecheck:e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pc-playwright-report-${{ matrix.shard }}
          path: react-pc-frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  mobile_lint:
    name: Zeiterfassung Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  mobile_unit_tests:
    name: Zeiterfassung Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  mobile_build:
    name: Zeiterfassung Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  mobile_e2e:
    name: Zeiterfassung E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: react-zeiterfassung
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-zeiterfassung/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zeiterfassung-playwright-results
          path: react-zeiterfassung/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Die Launcher-Skripte gehen per Auto-Update an alle PCs und Macs. Ein Syntaxfehler
  # legte dort auch das Selbst-Update lahm - deshalb hier echt parsen. pwsh 7 ist auf
  # ubuntu-latest vorinstalliert; die PCs laufen mit Windows PowerShell 5, also weiter
  # nur PS5-Syntax verwenden (kein ??, kein ?:, kein &&).
  launcher_skripte:
    name: Launcher-Skripte (Syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PowerShell-Skripte parsen
        shell: pwsh
        run: |
          $dateien = @(Get-ChildItem -Path deployment/openfile-launcher, src/main/resources/openfile-launcher -Filter *.ps1)
          if ($dateien.Count -eq 0) { throw 'Keine .ps1-Dateien gefunden' }
          $fehler = 0
          foreach ($d in $dateien) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($d.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $fehler++
              $pfad = Resolve-Path -Relative $d.FullName
              foreach ($e in $errors) { Write-Host "::error file=$pfad,line=$($e.Extent.StartLineNumber)::$($e.Message)" }
            } else { Write-Host "OK $($d.Name)" }
          }
          if ($fehler -gt 0) { exit 1 }

      - name: Bash-Skripte pruefen
        run: |
          fehler=0
          for f in src/main/resources/openfile-launcher/launcher-mac.sh src/main/resources/openfile-launcher/einrichten-mac.command; do
            if bash -n "$f"; then echo "OK $f"; else echo "::error file=$f::Syntaxfehler"; fehler=1; fi
          done
          exit "$fehler"

  quality_gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - launcher_skripte
      - backend_tests
      - db_kompatibilitaet
      - pc_lint
      - pc_unit_tests
      - pc_build
      - pc_e2e
      - mobile_lint
      - mobile_unit_tests
      - mobile_build
      - mobile_e2e
    steps:
      - name: Verify all required checks passed
        shell: bash
        run: |
          results=(
            "${{ needs.launcher_skripte.result }}"
            "${{ needs.backend_tests.result }}"
            "${{ needs.db_kompatibilitaet.result }}"
            "${{ needs.pc_lint.result }}"
            "${{ needs.pc_unit_tests.result }}"
            "${{ needs.pc_build.result }}"
            "${{ needs.pc_e2e.result }}"
            "${{ needs.mobile_lint.result }}"
            "${{ needs.mobile_unit_tests.result }}"
            "${{ needs.mobile_build.result }}"
            "${{ needs.mobile_e2e.result }}"
          )

          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "At least one required PR check did not pass."
              printf 'Results: %s\n' "${results[*]}"
              exit 1
            fi
          done

          echo "All required PR checks passed."
