name: Docker-Image fuer Kundenserver

# Baut nach jedem Push auf main das Docker-Image, prueft, dass es auf dem
# Datenbankstand der Kunden hochfaehrt (neue Flyway-Migrationen laufen durch,
# /actuator/health = 200) und legt es erst dann in die GitHub Container
# Registry. Die Kundenserver holen es sich nachts selbst ab
# (deployment/docker-server/nachtupdate.sh) - GitHub greift nie auf sie zu.
#
# Die Tests laufen vorher im Pull Request ("PR Quality Gate", siehe pr-ci.yml):
# main nimmt nur PRs an, die gruen und auf dem aktuellen Stand von main sind -
# was hier ankommt, ist also genau der getestete Stand. Deshalb wartet dieser
# Workflow nicht auf einen zweiten Testlauf auf main.
# Abgesichert wird das zusaetzlich im ersten Schritt unten: Ohne gemergten PR
# mit gruenem "PR Quality Gate" fuer genau diesen Stand gibt es kein Image -
# auch nicht nach einem Admin-Merge am Ruleset vorbei.
#
# Tags:
#   :stable          -> das, was die Kundenserver nachts installieren
#   :sha-<commit>    -> fester Stand, z.B. um gezielt eine Version einzuspielen
#
# Wissen der KI-Hilfe: Vor dem Starttest entsteht aus Doku und Quellcode dieses
# Stands die RAG-Datei und kommt ins Image (/app/ki-hilfe/rag-cache.json). So
# bringt jedes Nachtupdate auch das passende Wissen mit. Braucht das Secret
# GEMINI_API_KEY; ohne bleibt die Datei des letzten :stable (RAG_INDEXING.md).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rag_neu:
        description: "KI-Hilfe: RAG-Datei komplett neu einbetten (ohne Vorlage aus :stable)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: docker-image-main
  cancel-in-progress: false

jobs:
  image:
    name: Bauen, Starttest, Veroeffentlichen
    # NUR von main - auch beim manuellen Start. Sonst koennte ein ungetesteter
    # Feature-Branch als :stable bei allen Kunden landen.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read   # PR zum Commit finden (Pruefschritt)
      checks: read          # "PR Quality Gate" des PR lesen (Pruefschritt)
    timeout-minutes: 90
    env:
      COMMIT: ${{ github.sha }}
    steps:
      # Ersatz fuer den frueheren zweiten Testlauf auf main, in Sekunden statt
      # ~25 Minuten: Der Commit muss aus einem gemergten PR stammen, dessen
      # "PR Quality Gate" (GitHub Actions, App 15368) gruen war, und genau den
      # Stand haben, der dort getestet wurde. Sonst kein Image - z. B. nach
      # einem Admin-Merge ohne gruene Checks oder mit veraltetem Branch.
      - name: Pruefen, dass genau dieser Stand im PR gruen getestet wurde
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Direkt nach dem Merge ordnet GitHub den PR manchmal erst Sekunden spaeter zu.
          pr_head=""
          for versuch in 1 2 3 4 5; do
            pr_head="$(gh api "repos/$repo/commits/$COMMIT/pulls" \
              --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$COMMIT\")][0].head.sha // empty")"
            [ -n "$pr_head" ] && break
            sleep 10
          done
          if [ -z "$pr_head" ]; then
            echo "::error::$COMMIT stammt aus keinem gemergten Pull Request - kein Image."
            exit 1
          fi
          gate="$(gh api "repos/$repo/commits/$pr_head/check-runs?check_name=PR%20Quality%20Gate&filter=latest" \
            --jq '[.check_runs[] | select(.app.id == 15368 and .conclusion == "success")] | length')"
          if [ "$gate" -lt 1 ]; then
            echo "::error::Kein gruener \"PR Quality Gate\" fuer den PR-Stand $pr_head - kein Image."
            exit 1
          fi
          baum_main="$(gh api "repos/$repo/git/commits/$COMMIT" --jq .tree.sha)"
          baum_pr="$(gh api "repos/$repo/git/commits/$pr_head" --jq .tree.sha)"
          if [ "$baum_main" != "$baum_pr" ]; then
            echo "::error::Stand auf main weicht vom getesteten PR-Stand $pr_head ab (Branch war nicht aktuell) - kein Image."
            exit 1
          fi
          echo "Getestet im PR (Stand $pr_head, PR Quality Gate gruen) - Image wird gebaut."

      - name: Checkout (genau der getestete Commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      - name: Image-Namen festlegen
        id: name
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "kurz=${COMMIT:0:7}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Image bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: erp-starttest:latest
          build-args: GIT_COMMIT=${{ env.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bei der Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Wissen der KI-Hilfe (RAG-Datei, siehe RAG_INDEXING.md) ---
      # Ein Release haengt nie an der KI-Hilfe: Jeder Schritt hier faellt auf den
      # bisherigen Stand (Datei aus :stable) zurueck, statt den Job abzubrechen.

      # Vorlage ist die RAG-Datei aus dem aktuellen :stable - eingebettet wird nur,
      # was sich seitdem geaendert hat (Cent-Betraege). Netzproblem und "noch kein
      # :stable" werden unterschieden wie im Starttest: Ohne Vorlage wuerde sonst
      # alles neu eingebettet und das Image kaeme nur mit Teilwissen heraus.
      - name: KI-Hilfe - Vorlage aus :stable holen
        id: vorlage
        shell: bash
        env:
          RAG_NEU: ${{ inputs.rag_neu }}
        run: |
          set -uo pipefail
          mkdir -p ki-hilfe
          stable="${{ steps.name.outputs.image }}:stable"
          if [ "${RAG_NEU:-false}" = "true" ]; then
            echo "Von Hand angefordert: RAG-Datei komplett neu einbetten (ohne Vorlage)."
            echo "einbetten=ja" >> "$GITHUB_OUTPUT"
          elif ausgabe="$(docker pull -q "$stable" 2>&1)"; then
            if vorlage="$(docker create "$stable" 2>/dev/null)"; then
              if docker cp "$vorlage:/app/ki-hilfe/rag-cache.json" ki-hilfe/rag-cache.json 2>/dev/null; then
                echo "Vorlage: RAG-Datei aus $stable"
              else
                echo "$stable hat noch keine RAG-Datei - alles wird neu eingebettet."
              fi
              docker rm "$vorlage" >/dev/null 2>&1 || true
            fi
            echo "einbetten=ja" >> "$GITHUB_OUTPUT"
          elif grep -qiE "manifest unknown|not found" <<<"$ausgabe"; then
            echo "Noch kein :stable veroeffentlicht - alles wird neu eingebettet."
            echo "einbetten=ja" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$stable nicht ladbar - RAG-Datei wird diesmal nicht aktualisiert: $ausgabe"
            echo "einbetten=nein" >> "$GITHUB_OUTPUT"
          fi

      # Laeuft im gerade gebauten Image, ohne zweiten Maven-Lauf. Das Zeitlimit des
      # Indexers (12 min) wird zwischen zwei Stapeln geprueft; ein Stapel kann mit
      # Wiederholungen noch ~10 min dauern - daher "timeout 24m" und das Schritt-Limit.
      # Was fehlt, folgt beim naechsten Image.
      - name: KI-Hilfe - neue und geaenderte Abschnitte einbetten
        if: steps.vorlage.outputs.einbetten == 'ja'
        continue-on-error: true
        timeout-minutes: 26
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::warning::Secret GEMINI_API_KEY fehlt - RAG-Datei der KI-Hilfe nicht aktualisiert."
            exit 0
          fi
          if ! timeout 24m docker run --rm --user "$(id -u):$(id -g)" -e GEMINI_API_KEY \
                -v "$GITHUB_WORKSPACE:/quelle:ro" -v "$PWD/ki-hilfe:/ausgabe" \
                --entrypoint java erp-starttest:latest \
                -cp /app/app.jar -Dloader.main=org.example.kalkulationsprogramm.cli.StandaloneRagIndexer \
                org.springframework.boot.loader.launch.PropertiesLauncher \
                /quelle /ausgabe/rag-cache.json --max-minuten 12; then
            echo "::warning::RAG-Datei nur teilweise aktualisiert - der Rest folgt beim naechsten Image."
            exit 1
          fi

      - name: KI-Hilfe - RAG-Datei pruefen
        id: rag
        shell: bash
        run: |
          set -uo pipefail
          # Halb geschriebene Datei eines abgebrochenen Laufs nicht ins Image
          rm -f ki-hilfe/*.neu
          abschnitte=0
          if [ -s ki-hilfe/rag-cache.json ]; then
            abschnitte="$(jq '.abschnitte | length' ki-hilfe/rag-cache.json 2>/dev/null || echo 0)"
          fi
          if [[ "$abschnitte" =~ ^[1-9][0-9]*$ ]]; then
            # Der ERP-Benutzer im Container (uid 10001) muss sie lesen koennen
            chmod 0644 ki-hilfe/rag-cache.json
            echo "datei=ja" >> "$GITHUB_OUTPUT"
            echo "abschnitte=$abschnitte" >> "$GITHUB_OUTPUT"
            echo "KI-Hilfe: $abschnitte Abschnitte in der RAG-Datei" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Keine brauchbare RAG-Datei - die KI-Hilfe antwortet bei den Kunden ohne Programmwissen."
          fi

      # Dasselbe Image, nur mit der RAG-Datei (Dockerfile, Stufe "ki-hilfe").
      # Alles andere kommt aus dem Cache des ersten Baus. Das Label liest das
      # Nachtupdate fuer seine Meldung ("KI-Hilfe kennt ... Abschnitte").
      - name: Image mit RAG-Datei fertigstellen
        if: steps.rag.outputs.datei == 'ja'
        # Scheitert das, bleibt das Image aus dem ersten Bau (ohne RAG-Datei)
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: ki-hilfe=./ki-hilfe
          load: true
          push: false
          tags: erp-starttest:latest
          build-args: GIT_COMMIT=${{ env.COMMIT }}
          labels: de.erp-handwerk.ki-hilfe.abschnitte=${{ steps.rag.outputs.abschnitte }}
          cache-from: type=gha

      # Der wichtigste Schritt: Faehrt die neue Version auf dem Datenbankstand
      # hoch, den die Kunden gerade haben (= aktuelles :stable richtet eine leere
      # Datenbank ein), inklusive der neuen Migrationen? Kaputte Migrationen oder
      # Startfehler fallen hier auf - und nicht erst nachts bei jedem Kunden.
      # Details: deployment/docker-server/starttest.sh
      - name: Starttest (Upgrade vom aktuellen Kundenstand, PostgreSQL)
        shell: bash
        run: |
          set -euo pipefail
          basis="${{ steps.name.outputs.image }}:stable"
          if ausgabe="$(docker pull -q "$basis" 2>&1)"; then
            echo "Ausgangsstand: $basis"
          elif grep -qiE "manifest unknown|not found" <<<"$ausgabe"; then
            echo "Noch kein :stable veroeffentlicht - pruefe nur die Neuinstallation."
            basis=""
          else
            # Netz/Registry-Problem: lieber abbrechen als still ohne Migrationstest
            echo "::error::Kundenstand $basis nicht ladbar: $ausgabe"
            exit 1
          fi
          if ! deployment/docker-server/starttest.sh erp-starttest:latest ${basis:+"$basis"}; then
            echo "::error::Image faehrt auf PostgreSQL nicht sauber hoch - wird NICHT veroeffentlicht."
            exit 1
          fi

      # Bekannte Sicherheitsluecken in den Linux-Paketen und Java-Bibliotheken des
      # Images. Die hohen und kritischen stehen im Bericht des Laufs. KRITISCHE
      # Luecken, fuer die es schon eine Korrektur gibt, verhindern die
      # Veroeffentlichung (SPERRE: "ja"; mit "nein" nur eine Warnung). Seit
      # Spring Boot 4.1 / Java 25 ist das Image frei davon.
      # Eine bewusst hingenommene Luecke kommt mit Begruendung in .trivyignore
      # (eine CVE-Nummer je Zeile).
      #
      # Trivy laeuft als Container mit festem Digest und sieht nur das Image als
      # Datei, keine Zugangsdaten dieses Jobs (Docker-Login mit packages: write).
      # Grund: Im Maerz 2026 waren trivy-action und einzelne Trivy-Images
      # kompromittiert (GHSA-69fq-xp46-6x23). Neue Version nur mit neuem Digest:
      # docker buildx imagetools inspect ghcr.io/aquasecurity/trivy:<version>
      # Faellt Trivy selbst aus (Datenbank nicht ladbar, haengt), wird trotzdem
      # veroeffentlicht - wie bei der KI-Hilfe haengt ein Release nicht daran.
      # Deshalb begrenzt "timeout 9m" jeden Lauf selbst; das Schritt-Limit ist nur
      # die Notbremse und darf nie zuerst greifen (es wuerde den Job abbrechen).
      - name: Sicherheits-Scan (Trivy)
        timeout-minutes: 25
        shell: bash
        env:
          TRIVY: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          SPERRE: "ja"
        run: |
          set -uo pipefail
          scan="$RUNNER_TEMP/trivy"
          mkdir -p "$scan/cache"
          if ! docker save erp-starttest:latest -o "$scan/image.tar"; then
            echo "::warning::Image liess sich fuer den Sicherheits-Scan nicht exportieren - wird ohne Scan veroeffentlicht."
            exit 0
          fi
          ignorieren=()
          if [ -f .trivyignore ]; then
            if cp .trivyignore "$scan/trivyignore"; then
              ignorieren=(--ignorefile /scan/trivyignore)
            else
              echo "::warning::.trivyignore nicht uebernommen - Scan laeuft ohne Ausnahmeliste."
            fi
          fi
          trivy() {
            timeout -k 30s 9m docker run --rm -v "$scan:/scan" "$TRIVY" image --cache-dir /scan/cache \
              --input /scan/image.tar --scanners vuln --timeout 8m --no-progress \
              ${ignorieren[@]+"${ignorieren[@]}"} "$@"
          }

          if ! trivy --severity HIGH,CRITICAL --format table --output /scan/bericht.txt; then
            echo "::warning::Sicherheits-Scan nicht moeglich - Image wird ohne Scan veroeffentlicht."
            exit 0
          fi
          { echo "### Sicherheits-Scan: hohe und kritische Luecken"; echo '```'; head -c 900000 "$scan/bericht.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          trivy --skip-db-update --skip-java-db-update --severity CRITICAL --ignore-unfixed --exit-code 2 --format table
          ergebnis=$?
          case "$ergebnis" in
            0) echo "Keine kritische Luecke mit verfuegbarer Korrektur." ;;
            2) if [ "$SPERRE" = "ja" ]; then
                 echo "::error::Kritische Sicherheitsluecke mit verfuegbarer Korrektur im Image - wird NICHT veroeffentlicht. Basis-Image bzw. Bibliothek aktualisieren (oder begruendet in .trivyignore)."
                 exit 1
               fi
               echo "::warning::Kritische Sicherheitsluecke mit verfuegbarer Korrektur im Image (Liste oben) - bitte Basis-Image bzw. Bibliothek aktualisieren." ;;
            *) echo "::warning::Sperrpruefung fehlgeschlagen (Code $ergebnis) - Image wird ohne sie veroeffentlicht." ;;
          esac

      - name: Image veroeffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="${{ steps.name.outputs.image }}"
          docker tag erp-starttest:latest "$image:sha-${{ steps.name.outputs.kurz }}"
          docker push "$image:sha-${{ steps.name.outputs.kurz }}"
          # :stable nur, wenn dieser Commit noch der Stand von main ist. Ein
          # "Re-run" eines alten Laufs wuerde sonst eine aeltere Version auf
          # bereits migrierte Kundendatenbanken ausrollen.
          main_jetzt="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_jetzt" != "$COMMIT" ]; then
            echo "::warning::$COMMIT ist nicht mehr der Stand von main ($main_jetzt) - nur :sha-${{ steps.name.outputs.kurz }} veroeffentlicht, :stable unveraendert."
            exit 0
          fi
          docker tag erp-starttest:latest "$image:stable"
          docker push "$image:stable"
          echo "Veroeffentlicht: $image:stable (= sha-${{ steps.name.outputs.kurz }})" >> "$GITHUB_STEP_SUMMARY"
