name: Docker-Image fuer Kundenserver

# Baut nach jedem Push auf main das Docker-Image, prueft, dass es auf dem
# Datenbankstand der Kunden hochfaehrt (neue Flyway-Migrationen laufen durch,
# /actuator/health = 200) und legt es erst dann in die GitHub Container
# Registry. Die Kundenserver holen es sich nachts selbst ab
# (deployment/docker-server/nachtupdate.sh) - GitHub greift nie auf sie zu.
#
# Die Tests laufen vorher im Pull Request ("PR Quality Gate", siehe pr-ci.yml):
# main nimmt nur PRs an, die gruen und auf dem aktuellen Stand von main sind -
# was hier ankommt, ist also genau der getestete Stand. Deshalb wartet dieser
# Workflow nicht auf einen zweiten Testlauf auf main.
# Abgesichert wird das zusaetzlich im ersten Schritt unten: Ohne gemergten PR
# mit gruenem "PR Quality Gate" fuer genau diesen Stand gibt es kein Image -
# auch nicht nach einem Admin-Merge am Ruleset vorbei.
#
# Tags:
#   :stable          -> das, was die Kundenserver nachts installieren
#   :sha-<commit>    -> fester Stand, z.B. um gezielt eine Version einzuspielen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-image-main
  cancel-in-progress: false

jobs:
  image:
    name: Bauen, Starttest, Veroeffentlichen
    # NUR von main - auch beim manuellen Start. Sonst koennte ein ungetesteter
    # Feature-Branch als :stable bei allen Kunden landen.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read   # PR zum Commit finden (Pruefschritt)
      checks: read          # "PR Quality Gate" des PR lesen (Pruefschritt)
    timeout-minutes: 45
    env:
      COMMIT: ${{ github.sha }}
    steps:
      # Ersatz fuer den frueheren zweiten Testlauf auf main, in Sekunden statt
      # ~25 Minuten: Der Commit muss aus einem gemergten PR stammen, dessen
      # "PR Quality Gate" (GitHub Actions, App 15368) gruen war, und genau den
      # Stand haben, der dort getestet wurde. Sonst kein Image - z. B. nach
      # einem Admin-Merge ohne gruene Checks oder mit veraltetem Branch.
      - name: Pruefen, dass genau dieser Stand im PR gruen getestet wurde
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Direkt nach dem Merge ordnet GitHub den PR manchmal erst Sekunden spaeter zu.
          pr_head=""
          for versuch in 1 2 3 4 5; do
            pr_head="$(gh api "repos/$repo/commits/$COMMIT/pulls" \
              --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$COMMIT\")][0].head.sha // empty")"
            [ -n "$pr_head" ] && break
            sleep 10
          done
          if [ -z "$pr_head" ]; then
            echo "::error::$COMMIT stammt aus keinem gemergten Pull Request - kein Image."
            exit 1
          fi
          gate="$(gh api "repos/$repo/commits/$pr_head/check-runs?check_name=PR%20Quality%20Gate&filter=latest" \
            --jq '[.check_runs[] | select(.app.id == 15368 and .conclusion == "success")] | length')"
          if [ "$gate" -lt 1 ]; then
            echo "::error::Kein gruener \"PR Quality Gate\" fuer den PR-Stand $pr_head - kein Image."
            exit 1
          fi
          baum_main="$(gh api "repos/$repo/git/commits/$COMMIT" --jq .tree.sha)"
          baum_pr="$(gh api "repos/$repo/git/commits/$pr_head" --jq .tree.sha)"
          if [ "$baum_main" != "$baum_pr" ]; then
            echo "::error::Stand auf main weicht vom getesteten PR-Stand $pr_head ab (Branch war nicht aktuell) - kein Image."
            exit 1
          fi
          echo "Getestet im PR (Stand $pr_head, PR Quality Gate gruen) - Image wird gebaut."

      - name: Checkout (genau der getestete Commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      - name: Image-Namen festlegen
        id: name
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "kurz=${COMMIT:0:7}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: erp-starttest:latest
          build-args: GIT_COMMIT=${{ env.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bei der Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Der wichtigste Schritt: Faehrt die neue Version auf dem Datenbankstand
      # hoch, den die Kunden gerade haben (= aktuelles :stable richtet eine leere
      # Datenbank ein), inklusive der neuen Migrationen? Kaputte Migrationen oder
      # Startfehler fallen hier auf - und nicht erst nachts bei jedem Kunden.
      # Details: deployment/docker-server/starttest.sh
      - name: Starttest (Upgrade vom aktuellen Kundenstand, PostgreSQL)
        shell: bash
        run: |
          set -euo pipefail
          basis="${{ steps.name.outputs.image }}:stable"
          if ausgabe="$(docker pull -q "$basis" 2>&1)"; then
            echo "Ausgangsstand: $basis"
          elif grep -qiE "manifest unknown|not found" <<<"$ausgabe"; then
            echo "Noch kein :stable veroeffentlicht - pruefe nur die Neuinstallation."
            basis=""
          else
            # Netz/Registry-Problem: lieber abbrechen als still ohne Migrationstest
            echo "::error::Kundenstand $basis nicht ladbar: $ausgabe"
            exit 1
          fi
          if ! deployment/docker-server/starttest.sh erp-starttest:latest ${basis:+"$basis"}; then
            echo "::error::Image faehrt auf PostgreSQL nicht sauber hoch - wird NICHT veroeffentlicht."
            exit 1
          fi

      - name: Image veroeffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="${{ steps.name.outputs.image }}"
          docker tag erp-starttest:latest "$image:sha-${{ steps.name.outputs.kurz }}"
          docker push "$image:sha-${{ steps.name.outputs.kurz }}"
          # :stable nur, wenn dieser Commit noch der Stand von main ist. Ein
          # "Re-run" eines alten Laufs wuerde sonst eine aeltere Version auf
          # bereits migrierte Kundendatenbanken ausrollen.
          main_jetzt="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$main_jetzt" != "$COMMIT" ]; then
            echo "::warning::$COMMIT ist nicht mehr der Stand von main ($main_jetzt) - nur :sha-${{ steps.name.outputs.kurz }} veroeffentlicht, :stable unveraendert."
            exit 0
          fi
          docker tag erp-starttest:latest "$image:stable"
          docker push "$image:stable"
          echo "Veroeffentlicht: $image:stable (= sha-${{ steps.name.outputs.kurz }})" >> "$GITHUB_STEP_SUMMARY"
