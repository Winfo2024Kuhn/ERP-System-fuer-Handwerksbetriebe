name: PR-Branches aktuell halten

# Das Ruleset fuer main verlangt, dass ein PR vor dem Merge auf dem aktuellen
# Stand von main ist. Nach jedem Merge waeren alle anderen offenen PRs veraltet
# und blieben trotz Auto-Merge haengen, bis jemand "Update branch" klickt.
# Dieser Workflow macht das nach jedem Push auf main selbst - aber nur fuer PRs
# mit eingeschaltetem Auto-Merge (die sollen ja ohne Zutun durchlaufen).
#
# Wichtig: Eine Aenderung durch das eingebaute GITHUB_TOKEN loest KEINE
# Workflows aus - nach dem Update liefe der Pflicht-Check "PR Quality Gate"
# also nie und der PR hinge fuer immer. Ausgenommen davon ist workflow_dispatch:
# Deshalb startet dieser Workflow die Tests (pr-ci.yml) fuer jeden
# aktualisierten Branch ausdruecklich neu. Die Check-Runs haengen am neuen
# Head-Commit und zaehlen damit fuer den PR.
#
# PRs aus Forks werden uebersprungen (deren Branch gehoert nicht diesem Repo).
# Gibt es beim Update einen Konflikt, bleibt der PR stehen und braucht Hand.
# Merge-Queue waere die eingebaute Loesung, gibt es aber nur fuer Repos von
# Organisationen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Nicht abbrechen: Ein Abbruch zwischen "Branch aktualisiert" und "Tests
# gestartet" liesse den PR ohne Tests liegen. Hoechstens ein Lauf aktiv, einer
# wartend - die Schleife vertraegt Wiederholungen.
concurrency:
  group: pr-aktualisieren
  cancel-in-progress: false

jobs:
  aktualisieren:
    name: Veraltete PRs mit Auto-Merge aktualisieren
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # main in den PR-Branch holen (update-branch)
      pull-requests: write   # update-branch-API
      actions: write         # pr-ci.yml per workflow_dispatch starten
    steps:
      - name: Aktualisieren und Tests neu starten
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Nur offene PRs gegen main mit Auto-Merge, nicht aus Forks.
          prs="$(gh pr list --state open --base main --limit 100 \
            --json number,headRefName,headRefOid,isCrossRepository,autoMergeRequest \
            --jq '.[] | select(.autoMergeRequest != null and (.isCrossRepository | not)) | "\(.number) \(.headRefOid) \(.headRefName)"')"
          if [ -z "$prs" ]; then
            echo "Keine offenen PRs mit Auto-Merge."
            exit 0
          fi
          # Tests fuer einen Branch starten (Check-Runs landen auf dessen Kopf-Commit).
          starte_tests() {
            gh workflow run pr-ci.yml --ref="$1"
          }
          # Eigener Kanal (3): gh in der Schleife darf die Liste nicht von stdin wegessen.
          # Fehler bei einem PR brechen nicht alles ab - die anderen kommen trotzdem dran.
          while read -r nummer kopf branch <&3; do
            [ -n "$nummer" ] || continue
            if ! behind="$(gh api "repos/$GH_REPO/compare/main...$kopf" --jq .behind_by)" \
                || ! [[ "$behind" =~ ^[0-9]+$ ]]; then
              echo "::warning::PR #$nummer: Abstand zu main nicht lesbar - uebersprungen."
              continue
            fi
            if [ "$behind" -eq 0 ]; then
              # Selbstheilung: aktuell, aber noch nie getestet (z. B. frueherer
              # Lauf brach nach dem Update ab) -> Tests nachholen.
              laeufe="$(gh api "repos/$GH_REPO/commits/$kopf/check-runs?check_name=PR%20Quality%20Gate" \
                --jq .total_count 2>/dev/null || echo "?")"
              if [ "$laeufe" = "0" ]; then
                echo "PR #$nummer ist aktuell, aber ungetestet - starte Tests."
                starte_tests "$branch" || echo "::warning::PR #$nummer: Tests liessen sich nicht starten."
              else
                echo "PR #$nummer ist aktuell."
              fi
              continue
            fi
            echo "PR #$nummer liegt $behind Commit(s) hinter main - aktualisiere $branch."
            if ! gh api -X PUT "repos/$GH_REPO/pulls/$nummer/update-branch" \
                -f expected_head_sha="$kopf" --silent; then
              echo "::warning::PR #$nummer liess sich nicht aktualisieren (Konflikt oder inzwischen neuer Push) - bitte ansehen."
              continue
            fi
            # update-branch arbeitet im Hintergrund: warten, bis der neue Kopf da ist.
            neu="$kopf"
            for versuch in $(seq 1 30); do
              neu="$(gh pr view "$nummer" --json headRefOid --jq .headRefOid || echo "$kopf")"
              [ "$neu" != "$kopf" ] && break
              sleep 4
            done
            if [ "$neu" = "$kopf" ]; then
              echo "::warning::PR #$nummer: neuer Stand nach 2 Minuten nicht sichtbar - Tests holt der naechste Lauf nach."
              continue
            fi
            if starte_tests "$branch"; then
              echo "PR #$nummer aktualisiert ($neu), Tests gestartet."
            else
              echo "::warning::PR #$nummer aktualisiert, Tests liessen sich nicht starten - der naechste Lauf holt sie nach."
            fi
          done 3<<< "$prs"
